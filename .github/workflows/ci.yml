# فحص قبل أي دمج: صياغة الكود + مزامنة السندات على محاكي فايرستور ببيانات وهمية
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax
        run: |
          node tools/ci/check-syntax.js
          for f in server.js tools/*.js tools/ci/*.js; do node --check "$f"; done
      - name: Install test tools
        run: |
          npm install --no-save express@4 playwright@1.47.2 firebase-tools@13.15.4
          npx playwright install --with-deps chromium
      - name: Sync test on Firestore emulator
        run: |
          PORT=3111 node server.js > server.log 2>&1 &
          npx firebase emulators:exec --only firestore,auth --project mefleh-1efd3 \
            "node tools/ci/sync-test.js http://localhost:3111/"
