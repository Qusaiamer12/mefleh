<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام المفلح للمستودعات</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#075e35">
<style>
:root{
  --g:#075e35; --g2:#0b7a45; --bg:#f4f6f8; --line:#d8dee5;
  --y:#ffc000; --r:#b42318; --gold:#b8a44a; --txt:#17212b; --mut:#667085;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--txt)}
.hide{display:none !important}

/* ===== الترويسة ===== */
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:16px 22px;
  box-shadow:0 2px 12px #0002}
.logoWrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandLogo{width:78px;height:78px;border-radius:24px;object-fit:cover;
  box-shadow:0 4px 16px #0005;background:#111}
.brandText h1{font-size:25px;margin:0;letter-spacing:.5px}
.brandText p{margin:5px 0 0;color:#e7fff3;font-size:13px}
.brandSub{color:#f6e6a8;font-weight:700}
.hdrInfo{margin-right:auto;text-align:left;font-size:13px;color:#e7fff3}

/* ===== التبويبات ===== */
/* ===== الدرج الجانبي (يمين) ===== */
nav.tabs{position:fixed;top:0;right:0;bottom:0;width:250px;z-index:60;
  background:#0d3f26;color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:8px;
  box-shadow:-4px 0 18px #00000026;transition:transform .28s ease;overflow-y:auto}
body.navClosed nav.tabs{transform:translateX(100%)}
nav.tabs .navTitle{font-size:12.5px;color:#9fd9bd;font-weight:700;
  padding:2px 8px 8px;border-bottom:1px solid #1c5c3c;margin-bottom:4px}
nav.tabs button{background:transparent;color:#dbeee4;border:0;border-radius:10px;
  padding:12px 14px;font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;
  text-align:right;width:100%;display:block}
nav.tabs button:hover{background:#155e39}
nav.tabs button.active{background:var(--y);color:#3a2c00}

/* النوتش: مقبض ملتصق بحافة الدرج */
#navNotch{position:fixed;top:50%;right:250px;transform:translateY(-50%);z-index:61;
  width:26px;height:74px;border:0;cursor:pointer;
  background:var(--g);color:#fff;font-size:17px;font-weight:700;
  border-radius:12px 0 0 12px;box-shadow:-3px 0 12px #00000030;
  transition:right .28s ease,background .2s;padding:0;line-height:74px}
#navNotch:hover{background:var(--g2)}
body.navClosed #navNotch{right:0}

#navScrim{position:fixed;inset:0;background:#0006;z-index:59;display:none}
body.navOpenMobile #navScrim{display:block}

main{max-width:1400px;margin:auto;padding:14px;display:grid;gap:12px;
  margin-right:250px;transition:margin-right .28s ease}
body.navClosed main{margin-right:0}
header{transition:margin-right .28s ease;margin-right:250px}
body.navClosed header{margin-right:0}

@media(max-width:900px){
  main,header{margin-right:0 !important}
  body:not(.navClosed) #navScrim{display:block}
}

/* ===== البطاقات ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:0 1px 8px #0000000c}
.card h2{font-size:17px;margin:0 0 4px;color:var(--g)}
.hint,.small{font-size:12px;color:var(--mut);line-height:1.7;margin:6px 0 10px}

label{font-weight:700;font-size:13px;margin-bottom:5px;display:block}
input,select,textarea{width:100%;border:1px solid #c7d0d9;border-radius:10px;padding:9px;
  font-family:inherit;font-size:14px;background:#fff;color:var(--txt)}
textarea{min-height:210px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);outline-offset:-1px}

.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.row,.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-start}
/* مع dir=rtl الأزرار بتبدأ من اليمين تلقائيًا */
.tw,.scroll{direction:rtl}

/* ===== الأزرار (ألوان الملف الأصلي) ===== */
button.btn{border:0;border-radius:10px;padding:9px 15px;font-family:inherit;
  font-weight:700;font-size:14px;cursor:pointer;background:var(--g);color:#fff}
button.btn:hover{background:var(--g2)}
button.btn:disabled{opacity:.55;cursor:not-allowed}
button.blue{background:#e8f1ff;color:#084a96}
button.sec,button.alt,button.ghost{background:#e9eef2;color:#111827}
button.danger,button.red{background:#fee4e2;color:#912018}
button.orange,button.gold{background:#fff1c2;color:#664d03}
button.big{padding:12px 22px;font-size:15px}
button.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}

/* ===== الجداول (ترويسة خضراء + حدود كاملة) ===== */
.tw,.scroll{overflow:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:var(--g);color:#fff;border:1px solid #22543d;padding:7px;font-size:13px;white-space:nowrap}
td{border:1px solid #cfd6dc;padding:5px;text-align:center;font-size:13px}
td.name{text-align:right}
td input,td select{border:1px solid #dfe5ea;background:transparent;text-align:center;padding:4px;border-radius:6px}
tr.warn td{background:#fff8db}
tr.ok td{background:#eefbf3}
tr.tot td,.totalRow td{background:#fff1c2;font-weight:700}
tr.net td{background:#d9ead3;font-weight:700;font-size:15px}
.orangeHead{background:var(--y);font-weight:700;text-align:center;color:#000}
.vOut{color:var(--r);font-weight:700}
.vIn{color:#0f5132;font-weight:700}

/* ===== صناديق الأرقام ===== */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.box,.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.box b,.stat b{display:block;font-size:19px;color:#0f5132;margin-top:4px}
.box span,.stat span{font-size:12.5px;color:var(--mut);font-weight:700}

.badge,.chip{background:#fff1c2;border:1px solid #ffd25d;color:#664d03;
  border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;display:inline-block}
.chip.cOk{background:#eefbf3;border-color:#8fd3ae;color:#0f5132}
.chip.cWarn{background:#fff1c2;border-color:#ffd25d;color:#664d03}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px;
  font-size:13px;line-height:1.7;margin-top:10px}
.okbox{background:#eefbf3;border:1px solid #8fd3ae;border-radius:12px;padding:10px;
  font-size:13px;line-height:1.7;margin-top:10px}
pre.wa{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;
  white-space:pre-wrap;font:13.5px/1.9 Tahoma,Arial;max-height:420px;overflow:auto;text-align:right}

/* ===== الكشف المطبوع ===== */
.statement{margin:16px 0;border:2px solid #111;padding:10px;background:#fff}
.statementHeader{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.statementHeader h2{margin:0}
.reportLogo{width:120px;object-fit:contain;border-radius:10px;border:2px solid var(--gold)}
.watermark{position:relative}
.watermark:before{content:'ALMEFLEH';position:absolute;inset:auto 0 30%;text-align:center;
  font-size:70px;font-weight:bold;color:#075e350d;pointer-events:none;z-index:0}
.watermark>*{position:relative;z-index:1}

.bar{height:9px;background:#e6ebf0;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:99px}
.chkRow{display:flex;align-items:center;gap:9px;margin-top:12px;font-weight:600;
  font-size:13.5px;cursor:pointer}
.chkRow input{width:17px;height:17px;flex:0 0 auto;cursor:pointer}
.kbd{background:#ffffff2e;border:1px solid #ffffff40;border-radius:5px;padding:1px 6px;
  font-size:11px;margin-right:6px;font-weight:600}
.mut{color:var(--mut)}
#dropZone{border:2.5px dashed #9bb8a8;border-radius:14px;background:#f6fbf8;
  padding:26px 18px;text-align:center;cursor:pointer;transition:.15s;margin-top:6px}
#dropZone:hover{background:#eef7f2;border-color:var(--g2)}
#dropZone:focus{outline:2px solid var(--g2);outline-offset:2px}
#dropZone.over{background:#dff1e7;border-color:var(--g);transform:scale(1.01)}
.dzIcon{font-size:34px;line-height:1}
.dzMain{font-size:16px;font-weight:800;color:var(--g);margin-top:8px}
.dzSub{font-size:12.5px;color:var(--mut);margin-top:5px}
/* ===== كشف حساب الزبون الخاص ===== */
.pubBox{margin-top:12px;background:#f6fbf8;border:1px solid #cfe4d8;border-radius:10px;padding:10px 12px}
.pubRow{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.pubTag{border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:700}
.pubTag.on{background:#d1fae5;color:#065f46;cursor:pointer}
.pubTag.on:hover{background:#a7f3d0}
.pubTag.off{background:#fff1c2;color:#664d03}
.waitBox{text-align:center;padding:34px 18px}
.waitIcon{font-size:40px;margin-bottom:8px}
.cliGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.cliCard{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;
  background:#fff;transition:.13s}
.cliCard:hover{border-color:var(--g2);box-shadow:0 3px 10px #0000000f}
.cliCard.on{border-color:var(--g);border-width:2px;background:#f6fbf8}
.cliTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cliTop b{font-size:14.5px}
.cliBal{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.cliBal.owe{color:var(--r)}.cliBal.cred{color:#0f5132}
.cliMeta{font-size:11.5px;color:var(--mut);margin-top:5px;display:flex;gap:6px;
  align-items:center;flex-wrap:wrap}
.cliNote{font-size:11.5px;color:#5a6b7c;margin-top:4px;background:#f6f8fb;
  border-radius:6px;padding:3px 7px}
.tagOwe{background:#fee4e2;color:#912018;border-radius:99px;padding:1px 7px;font-weight:700}
.tagCred{background:#d1fae5;color:#065f46;border-radius:99px;padding:1px 7px;font-weight:700}
.tagZero{background:#eef2f6;color:#475569;border-radius:99px;padding:1px 7px;font-weight:700}
.cliAct{display:flex;gap:6px;margin-top:9px}
.lPh{font-size:12.5px;color:var(--mut);margin-right:10px;direction:ltr;display:inline-block}
details.ledCfg{margin-top:12px;border:1px dashed var(--line);border-radius:10px;
  padding:10px 12px;background:#fafcfe}
details.ledCfg summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--g)}
.ledSheet{border:2px solid var(--g)}
.ledHead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border-bottom:3px double var(--g);padding-bottom:12px;margin-bottom:12px}
.ledLogo{width:150px;object-fit:contain;border-radius:8px;border:2px solid var(--gold)}
.ledCo{flex:1;min-width:180px}
.coName{font-size:19px;font-weight:800;color:var(--g);line-height:1.4}
.coSub{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.5px}
.ledTitle{background:var(--g);color:#fff;padding:8px 22px;border-radius:10px;
  font-size:17px;font-weight:800}
.ledTo{display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;background:#f6fbf8;border:1px solid #cfe4d8;border-radius:10px;
  padding:10px 14px;margin-bottom:12px}
.ledTo .lbl{color:var(--mut);font-size:12.5px;font-weight:700}
.ledTo .lVal{font-size:17px;font-weight:800;color:var(--g);margin-right:8px}
.lPeriod{font-size:12.5px;color:var(--mut);font-weight:700;direction:ltr}
.ledTbl .lDate{direction:ltr;font-size:12px}
.ledFoot{margin-top:14px;border-top:2px dashed var(--line);padding-top:12px;font-size:13px}
.sigRow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:14px;color:var(--mut);font-size:12.5px}

/* ===== الطلبات والإشعارات والرسائل ===== */
.pwCode{background:#0d3f26;color:#d7ffe9;border:0;font-size:13px;letter-spacing:.5px;padding:2px 9px}
.pwDots{letter-spacing:3px;color:var(--mut);font-size:15px}
tr.pwChanged td{background:#fff8db}
.byUser{background:#fff1c2;color:#664d03;border-radius:99px;padding:1px 8px;font-weight:700;font-size:11px}
.badgeN{background:#e11d48;color:#fff;border-radius:99px;padding:1px 7px;
  font-size:10.5px;font-weight:800;margin-right:4px;display:inline-block}
.priceCell{cursor:pointer;position:relative;transition:.12s}
.priceCell:hover{background:#fff8db;outline:2px solid var(--y);outline-offset:-2px}
.priceCell .editHint{opacity:0;font-size:11px;color:var(--mut);margin-right:4px}
.priceCell:hover .editHint{opacity:1}
.priceCell.pendPrice{background:#fff4c2}
.pendTag{font-size:10.5px;color:#7a5b00;font-weight:700;margin-top:2px}

.reqCard{border-right:5px solid var(--line)}
.reqCard.pending{border-right-color:var(--y)}
.reqCard.approved{border-right-color:#2ecc8f}
.reqCard.rejected{border-right-color:var(--r)}
.reqTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.reqBody{margin-top:8px;font-size:13px}
.priceFlow{font-size:17px;font-weight:800;margin-bottom:5px}
.priceFlow .old{color:var(--mut);text-decoration:line-through;font-size:14px}
.priceFlow .new{color:var(--g)}
.stTag{border-radius:99px;padding:2px 11px;font-size:11.5px;font-weight:800}
.stTag.pending{background:#fff1c2;color:#664d03}
.stTag.approved{background:#d1fae5;color:#065f46}
.stTag.rejected{background:#fee4e2;color:#912018}

.noteCard{border-right:5px solid var(--line)}
.noteCard.fresh{background:#f6fbf8}
.noteCard.req{border-right-color:var(--y)}
.noteCard.ok{border-right-color:#2ecc8f}
.noteCard.bad{border-right-color:var(--r)}
.noteCard.msg{border-right-color:var(--acc,#4f8cff)}

.chatBox{max-height:430px;overflow-y:auto;background:#f6f8fb;border:1px solid var(--line);
  border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:9px}
.bubble{max-width:74%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.65}
.bubble.mine{align-self:flex-start;background:var(--g);color:#fff;border-bottom-right-radius:5px}
.bubble.theirs{align-self:flex-end;background:#fff;border:1px solid var(--line);
  border-bottom-left-radius:5px}
.bMeta{font-size:10px;opacity:.7;margin-top:4px}
.bTxt{white-space:pre-wrap;word-break:break-word}

/* ===== شاشة الدخول ===== */
body.loginMode header,body.loginMode nav.tabs,body.loginMode #navNotch,
body.loginMode #navScrim{display:none !important}
body.loginMode main{margin:0 !important;max-width:none;padding:0;display:block}
body.loginMode{overflow:hidden}

.loginWrap{min-height:100vh;display:flex;direction:ltr}
.loginArt{flex:1 1 auto}                              /* يسار الشاشة */
.loginSide{flex:0 0 clamp(420px,40%,560px);direction:rtl}  /* يمين الشاشة */

@keyframes artZoom{from{transform:scale(1)}to{transform:scale(1.07)}}
.artShade{position:absolute;inset:0;z-index:1;
  background:linear-gradient(90deg,transparent 45%,#0a0a0a55 78%,#0a0a0aaa 100%),
             linear-gradient(0deg,#050505e8 0%,#05050566 26%,transparent 52%)}
.artCopy{position:absolute;right:0;left:0;bottom:52px;z-index:2;padding:0 52px;
  text-align:right;direction:rtl}
.artLine{width:56px;height:4px;border-radius:99px;background:var(--gold);
  margin-bottom:18px;box-shadow:0 0 22px #b8a44a99}
.artH1{margin:0;font-size:38px;line-height:1.32;font-weight:800;color:#fff;
  letter-spacing:-.3px;text-shadow:0 4px 26px #000000cc}
.artH1 span{color:var(--gold)}
.artP{margin:12px 0 0;font-size:14.5px;color:#ffffffbb;font-weight:600;letter-spacing:.3px}

/* ---------- اليمين: البطاقة ---------- */
.loginSide{display:flex;align-items:center;justify-content:center;padding:32px 30px;
  background:#fbfcfd;position:relative;overflow:hidden}
.loginSide:before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,#075e350e,transparent 68%);top:-230px;right:-230px}
.loginSide:after{content:'';position:absolute;width:440px;height:440px;border-radius:50%;
  background:radial-gradient(circle,#b8a44a18,transparent 68%);bottom:-170px;left:-160px}

.loginCard{position:relative;z-index:2;width:100%;max-width:372px;
  animation:cardIn .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.lgBrand{display:flex;justify-content:center;margin-bottom:26px}
.lgLogo{width:186px;border-radius:12px;
  filter:drop-shadow(0 10px 26px #075e3526)}

.lgHead{text-align:center;margin-bottom:28px}
.lgHead h2{margin:0;font-size:25px;font-weight:800;color:#0f2c1e;letter-spacing:-.4px}
.lgSub{margin:7px 0 0;font-size:13px;color:#8a97a3;font-weight:500}

/* حقول بتسمية عائمة */
.lgField{margin-bottom:15px}
.lgInput{position:relative;display:flex;align-items:center;
  background:#fff;border:1.7px solid #e3e9ee;border-radius:14px;
  transition:border-color .18s, box-shadow .18s;padding:0 14px}
.lgInput:focus-within{border-color:var(--g2);box-shadow:0 0 0 4px #0b7a4514}
.lgSvg{width:19px;height:19px;fill:#b3bfc9;flex:0 0 auto;transition:fill .18s}
.lgInput:focus-within .lgSvg{fill:var(--g2)}
.lgInput input{border:0;background:transparent;flex:1;min-width:0;
  padding:20px 11px 8px;font-size:15px;font-family:inherit;color:#12202c;
  outline:none !important;box-shadow:none !important}
.lgInput label{position:absolute;right:46px;top:50%;transform:translateY(-50%);
  font-size:14.5px;color:#9aa6b1;font-weight:500;pointer-events:none;
  transition:.16s cubic-bezier(.2,.9,.3,1);background:transparent}
.lgInput input:focus + label,
.lgInput input:not(:placeholder-shown) + label{
  top:13px;transform:none;font-size:11px;color:var(--g2);font-weight:700}

.lgEye{background:none;border:0;cursor:pointer;padding:6px;flex:0 0 auto;
  display:flex;align-items:center;border-radius:8px;transition:.15s}
.lgEye svg{width:19px;height:19px;fill:#b3bfc9;transition:fill .15s}
.lgEye:hover svg{fill:var(--g)}
.lgEye.on svg{fill:var(--g)}

.lgBtn{width:100%;margin-top:24px;padding:15px;border:0;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,#0a6b3c,#0d8a4f);color:#fff;
  font:inherit;font-size:15.5px;font-weight:800;letter-spacing:.2px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 10px 26px #075e3533;transition:.2s;position:relative;overflow:hidden}
.lgBtn:before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,#0d8a4f,#12a05e);opacity:0;transition:opacity .2s}
.lgBtn:hover{transform:translateY(-2px);box-shadow:0 15px 34px #075e3544}
.lgBtn:hover:before{opacity:1}
.lgBtn:active{transform:translateY(0)}
.lgBtn span,.lgBtn svg{position:relative;z-index:1}
.lgArrow{width:18px;height:18px;fill:#fff;transform:scaleX(-1);transition:transform .2s}
.lgBtn:hover .lgArrow{transform:scaleX(-1) translateX(4px)}

#lgMsg .note{margin-top:15px;text-align:center;font-size:13px;border-radius:12px}

@media(max-width:900px){
  body.loginMode{overflow:auto}
  .loginWrap{grid-template-columns:1fr}
  .loginArt{display:none}
  .loginSide{min-height:100vh}
}

/* تذييل القائمة الجانبية *//* تذييل القائمة الجانبية *//* تذييل القائمة الجانبية */
.navFoot{margin-top:auto;padding-top:14px;border-top:1px solid #1c5c3c}
.navUser{font-size:13px;color:#cfe9db;font-weight:700;padding:0 8px 10px}
.navOut{width:100%;background:#7a1f1f;color:#fff;border:0;border-radius:9px;
  padding:10px;font:inherit;font-weight:700;cursor:pointer;font-size:13.5px}
.navOut:hover{background:#932525}
.roleTag{background:var(--y);color:#3a2c00;border-radius:99px;padding:1px 8px;
  font-size:10.5px;font-weight:800}
code{background:#f1f5f9;border:1px solid var(--line);border-radius:5px;padding:1px 6px;
  font-family:Consolas,monospace;direction:ltr;display:inline-block}

/* ===== شكل الكشف: مجمّع بالأيام وملوّن ===== */
table.sheet{border-collapse:collapse;width:100%;font-size:13px}
table.sheet td,table.sheet th{border:1px solid #b9c6cf;padding:5px 7px;text-align:center}
table.sheet .name{text-align:right;font-weight:600}
table.sheet .amt{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}

.secHead{font-size:15px;font-weight:800;letter-spacing:.3px;padding:8px !important}
.secHead.so{background:#ffc000 !important;color:#3a2c00 !important;border-color:#d9a300 !important}
.secHead.si{background:#8fd3ae !important;color:#0c3d24 !important;border-color:#5fae87 !important}
table.sheet tr.colHead th{background:#0d3f26;color:#fff;font-size:12.5px;font-weight:700}

/* خلية اليوم المدموجة */
.dayCell{vertical-align:middle;font-weight:800;font-size:13.5px;min-width:86px}
.dayCell .dDate{font-size:10.5px;font-weight:600;opacity:.75;margin-top:2px;direction:ltr}
.daySum td{background:#f1f5f9;font-weight:700;font-size:12.5px;color:#31465c}

/* ألوان الأيام */
.d-sat .dayCell,.d-sat.daySum td{background:#fde2e2;color:#7a1f1f}
.d-sun .dayCell,.d-sun.daySum td{background:#ffe8cc;color:#7a4310}
.d-mon .dayCell,.d-mon.daySum td{background:#fff4c2;color:#6b5300}
.d-tue .dayCell,.d-tue.daySum td{background:#e0f2d9;color:#2b5320}
.d-wed .dayCell,.d-wed.daySum td{background:#d6ecfa;color:#12455f}
.d-thu .dayCell,.d-thu.daySum td{background:#e6ddf7;color:#3f2a70}
.d-fri .dayCell,.d-fri.daySum td{background:#e3e8ee;color:#39434d}
.d-any .dayCell{background:#eef2f6;color:#334}
.dayRow:hover td{background:#fafcff}

.custHead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--g);padding-bottom:8px;margin-bottom:10px}
.custHead h2{margin:0;font-size:18px;color:var(--g)}
.custMeta{font-size:12.5px;color:var(--mut);font-weight:600}
.stat.big b{font-size:26px}
details.card summary{cursor:pointer;font-size:15px;color:var(--g);list-style:revert}
details.card summary::marker{color:var(--g)}

.tzTag{background:#ffffff26;border:1px solid #ffffff40;border-radius:6px;padding:1px 7px;
  font-size:11px;margin-right:6px}
.netDot{font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 9px;
  border:1px solid #ffffff40}

.netDot.off{background:#7a1f1f;color:#ffd9d9}
.kbd2{display:inline-block;background:#fff;border:1px solid #b9c6cf;border-bottom-width:2px;

.up{color:#0f5132;font-weight:800}

.toast.t-ok{background:#0f5132}
.toast.t-warn{background:#7a5b00}
.toast.t-bad{background:#8a1c14}

.undoBtn:hover{background:#ffffff3d}

.modalWrap{position:fixed;inset:0;background:#0007;z-index:1000;display:flex;
  align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:460px;width:100%;

.modal h3.dg{color:var(--r)}
.modal .mBody{font-size:14px;line-height:1.8;color:#344054}
.modal .mInput{margin-top:12px}
.modal .mBtns{display:flex;gap:8px;margin-top:18px}
.modal .mBtns .btn{flex:0 0 auto}

/* ---------- أدوات ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
/* ===== التاريخ والمنطقة الزمنية =====
   toISOString بترجّع UTC — بالأردن (+3) هاد بيخلي السند بعد 9 مساءً
   ينحسب على اليوم اللي بعده. لهيك منستخدم التاريخ المحلي دائمًا. */
function TZ(){ try{ return settings.tz || Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Amman'; }
              catch(e){ return 'Asia/Amman'; } }
function ymd(d){
  d=d||new Date();
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
const todayStr = () => ymd(new Date());
/* اسم اليوم بالعربي من تاريخ YYYY-MM-DD */
const AR_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function dayNameOf(dateStr){
  if(!dateStr) return '';
  const d=new Date(dateStr+'T12:00:00');   /* الظهر: يتفادى فروق التوقيت */
  return isNaN(d)?'':AR_DAYS[d.getDay()];
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* ===== التنبيهات: توست ملوّن مع زر تراجع اختياري ===== */
function toast(msg,ms=2200){ notify(msg,'ok',ms); }
function notify(msg,kind='ok',ms=2600,undoFn=null,undoLabel='تراجع'){
  const t=$('toast'); if(!t) return;
  t.className='toast t-'+kind;
  t.innerHTML='<span></span>';
  t.firstChild.textContent=msg;
  if(undoFn){
    const b=document.createElement('button');
    b.className='undoBtn'; b.textContent='↩ '+undoLabel;
    b.onclick=()=>{ clearTimeout(t._t); t.className='hide'; t.innerHTML=''; undoFn(); };
    t.appendChild(b);
  }
  clearTimeout(t._t);
  t._t=setTimeout(()=>{t.className='hide';t.innerHTML='';},ms);
}

/* ===== نافذة تأكيد عربية بدل confirm() ===== */
function ask(opts){
  return new Promise(res=>{
    const o=Object.assign({title:'تأكيد',body:'',ok:'تأكيد',cancel:'إلغاء',danger:false,
                           requireText:null},opts||{});
    const wrap=document.createElement('div');
    wrap.className='modalWrap';
    wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
      <h3 class="${o.danger?'dg':''}">${o.title}</h3>
      <div class="mBody">${o.body}</div>
      ${o.requireText?`<input class="mInput" id="__mIn" placeholder="اكتب: ${o.requireText}" autocomplete="off">`:''}
      <div class="mBtns">
        <button class="btn ${o.danger?'danger':''}" id="__mOk">${o.ok}</button>
        ${o.cancel?`<button class="btn sec" id="__mNo">${o.cancel}</button>`:''}
      </div></div>`;
    document.body.appendChild(wrap);
    const done=v=>{
      document.removeEventListener('keydown',onKey);
      /* نلتقط قيم أي حقول داخل النافذة قبل ما نشيلها */
      let vals=null;
      if(v){
        vals={};
        wrap.querySelectorAll('input,textarea,select').forEach(el=>{
          if(el.id) vals[el.id]=el.value;
        });
      }
      wrap.remove();
      res(v?(Object.keys(vals||{}).length?{ok:true,vals}:true):false);
    };
    /* نبحث داخل هذه النافذة فقط — ممكن تكون في أكثر من نافذة مفتوحة */
    const okBtn=wrap.querySelector('.mBtns .btn'), inp=wrap.querySelector('.mInput');
    if(o.requireText){
      okBtn.disabled=true;
      inp.addEventListener('input',()=>{ okBtn.disabled = norm(inp.value)!==norm(o.requireText); });
    }
    okBtn.onclick=()=>done(true);
    const noBtn=wrap.querySelector('.mBtns .btn.sec'); if(noBtn) noBtn.onclick=()=>done(false);
    wrap.onclick=e=>{ if(e.target===wrap) done(false); };
    function onKey(e){ if(e.key==='Escape') done(false);
      if(e.key==='Enter'&&!okBtn.disabled&&document.activeElement!==inp) done(true); }
    document.addEventListener('keydown',onKey);
    setTimeout(()=>(inp||okBtn).focus(),40);
  });
}

function idbOpen(){
  return new Promise(res=>{
    try{
      if(!window.indexedDB) return res(false);
      const rq=indexedDB.open('warehouse_db',1);
      rq.onupgradeneeded=e=>{ const db=e.target.result;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
      rq.onsuccess=e=>{IDB.db=e.target.result;IDB.ok=true;res(true)};
      rq.onerror=()=>res(false);
      setTimeout(()=>res(IDB.ok),2500);   /* ما ننتظر للأبد */
    }catch(e){res(false)}
  });
}
function idbSet(k,v){

function idbGet(k){
  return new Promise(res=>{
    if(!IDB.ok) return res(undefined);
    try{ const r=IDB.db.transaction('kv','readonly').objectStore('kv').get(k);

<script>
/* ==========================================================

const DAYS={'السبت':'السبت','الاحد':'الأحد','الأحد':'الأحد','الاثنين':'الاثنين','الإثنين':'الاثنين',
  'الثلاثاء':'الثلاثاء','الاربعاء':'الأربعاء','الأربعاء':'الأربعاء','الخميس':'الخميس','الجمعة':'الجمعة',

const OUT_W=['اخراج','خروج','خارج','طلع','طلعنا','طالع','سحب','سحبنا','صادر','تحميل','حملنا',
  'صرف','صرفنا','شحن','شحنا','سلمنا','تسليم','بيع','بعنا','نزلنا عند','رحل','مشحون','طلبية','للزبون'];
const IN_W =['ادخال','دخول','داخل','وارد','استلمنا','استلام','توريد','تنزيل','نزلنا','وصل','وصلنا',
  'مرتجع','راجع','رجع','رجعوا','ارجاع','اضافة','اضفنا','جانا','اجانا','دخل','ادخل','تعبئة','انتاج'];

/* كلمات الإلغاء: بتشيل السطر اللي قبلها */
const CANCEL_W=/^(?:الغاء|الغي|تجاهل|احذف|شطب|غلط|خطا|مش صحيح|بدل|صحح|تصحيح|عفوا|اسف|سوري)(?![\u0600-\u06FF])/;

const NOISE=/^(?:صباح|مساء|السلام|وعليكم|شكرا|تمام|ماشي|اوك|ok|حاضر|يعطيك|الله|تسلم|مرحبا|اهلا|كيفك|بخير|ان شاء|يسلمو|طيب|زين|منيح|الحمد|كيف|شو|وينك|بعدين|هلا|يا هلا|الف|عافيه|نورت|تكرم|امر|ابشر|جاهز|خلص|بالتوفيق)(?![\u0600-\u06FF])|(?:وسائط|تم حذف|deleted|omitted|<Media|joined|removed|this message|edited|تم تعديل|صورة|فيديو|ملصق|sticker|image|video)/i;

/* أسئلة واستفسارات — مش سندات */
const QUESTION=/[؟?]\s*$|^(?:كم|قديش|شو|كيف|وين|متى|امتى|ليش|هل|في عندك|بدي اعرف|ممكن تبعت|ابعتلي)(?![\u0600-\u06FF])/;

/* ===== مطابقة ضبابية: تتحمّل أخطاء إملائية ===== */
function lev(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  if(Math.abs(m-n)>3) return 99;
  let prev=Array.from({length:n+1},(_,i)=>i),cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
/* تشابه 0..1 */
function sim(a,b){
  if(!a||!b) return 0;
  const d=lev(a,b), L=Math.max(a.length,b.length);
  return L?1-d/L:0;
}

/* ===== ذاكرة التصحيحات: النظام بيتعلّم من تعديلاتك ===== */
function learnMap(){ settings.learn=settings.learn||{}; return settings.learn; }
function learn(wrong,right){
  const k=key(wrong); if(!k||k===key(right)) return;
  const m=learnMap(); m[k]=right; saveSet();

/* ==========================================================
   قواعد أعمال ALMEFLEH — تنطبق على النص والصورة
   ========================================================== */

/* 1) توحيد المرادفات: أي «مشرح بالجزر» بكل صوره = صنف واحد */
const SYNONYMS=[
  /* [نمط يطابق النص, الاسم المعتمد] */
  [/مشرح\s*بالجزر|بالجزر\s*الحار|جزر\s*حار|اسود\s*الذره|اسود\s*ذره|مشرح.*جزر/, 'مشرح بالجزر'],
];
/* كلمات وصفية بتنشال من الاسم قبل المطابقة */
const DROP_WORDS=/(?:^|\s)(?:سوبر|اكسترا|ممتاز|درجه\s*اولى|فاخر|خاص|عادي|نوع\s*ا|premium|super|extra)(?=\s|$)/g;
/* استثناء: أصناف «السوبر» فيها صنف مستقل بسعر مختلف — ما منهمل الوصف */
const KEEP_SUPER=[/مكدوس/];
const SUPER_RE=/(?:^|\s)(?:سوبر|اكسترا|super|extra)(?=\s|$)/;
/* كلمات عامة بالفواتير مش جزء من اسم الصنف بقائمتنا */
const GENERIC=/(?:^|\s)(?:زيتون|فلفل|بلدي|شرايح|شرائح|حب|حبات|منتج|صنف)(?=\s|$)/g;
/* «اخضر/اسود» أحيانًا وصف عام وأحيانًا جزء من الاسم — منشيلها بس إذا ضل اسم يطابق القائمة */
const COLOR=/(?:^|\s)(?:اخضر|اسود|احمر)(?=\s|$)/g;

/* بيرجّع الاسم بعد تطبيق المرادفات وحذف الأوصاف */
function applyBusinessRules(rawName){
  let n=norm(rawName);
  const notes=[];
  for(const [re,canon] of SYNONYMS){
    if(re.test(n)){
      if(key(n)!==key(canon)) notes.push('وحّدته مع: '+canon);
      n=canon; break;
    }
  }
  const before=n;
  /* لو الصنف من عيلة «السوبر إله سعر مستقل»، منحوّله لاسم السوبر المعتمد */
  const isSuper=SUPER_RE.test(n);
  const keepSuper=isSuper && KEEP_SUPER.some(re=>re.test(n));
  if(keepSuper){
    const fam=KEEP_SUPER.find(re=>re.test(n));
    const famName=(n.match(fam)||[''])[0];
    const canon=(famName+' سوبر').replace(/\s+/g,' ').trim();
    if(key(n)!==key(canon)) notes.push('سجّلته سوبر: '+canon);
    return {name:canon,notes};
  }
  n=n.replace(DROP_WORDS,' ').replace(/\s+/g,' ').trim();
  const droppedDesc = n!==before;
  /* نشيل الكلمات العامة بس إذا ضل في اسم مفيد بعدها */
  const stripped=n.replace(GENERIC,' ').replace(/\s+/g,' ').trim();
  if(stripped && stripped.length>=3) n=stripped;
  /* اللون: منجرّب نشيله، وإذا الناتج بيطابق القائمة منعتمده */
  if(COLOR.test(n)){
    const noColor=n.replace(COLOR,' ').replace(/\s+/g,' ').trim();
    if(noColor.length>=3){
      const hitNo=findItem(noColor)||matchSized(noColor,[]);
      const hitAs=findItem(n)||matchSized(n,[]);
      if(hitNo && !hitAs) n=noColor;
    }
  }
  if(droppedDesc && !notes.length) notes.push('أهملت الوصف (سوبر/اكسترا)');
  return {name:n||before,notes};
}

/* 2) وحدات الفواتير: الكمية بالكيلو إلا إذا انكتب «مرتبان» صراحة */
const PIECE_UNITS=/مرتبان|مرطبان|مرتبانات|عبوه|عبوة|قطعه|قطعة|حبه|حبة|طرد|كرتون|علبه|علبة/;
/* قاعدة ALMEFLEH: الكمية بالفواتير دائمًا كيلو.
   عمود «الوحدة» مش موثوق — المرتبان بس إذا انكتب داخل اسم الصنف نفسه
   (مثال: «مشكل مرتبان 1ك»).                                        */
function unitIsPieces(unitTxt,itemTxt){
  return PIECE_UNITS.test(norm(itemTxt||''));
}

/* 3) حجم افتراضي لأصناف معروفة لما ما ينذكر حجم */
const DEFAULT_SIZE={'مكدوس':4,'مكدوس سوبر':4};
function defaultSizeFor(baseName){
  const k=key(baseName);
  for(const n in DEFAULT_SIZE) if(key(n)===k) return DEFAULT_SIZE[n];
  return null;
}

/* 4) تحويل كيلوات -> عدد عبوات */
function kgToPacks(kg,packSize){
  if(!packSize||packSize<=0) return null;
  const n=kg/packSize;
  const r=Math.round(n);
  /* نقبل فرق بسيط جدًا (كسور التقريب بالفواتير) */
  return Math.abs(n-r)<0.02 ? {packs:r,exact:true} : {packs:+n.toFixed(3),exact:false};
}

/* ===== مضاعِفات: «٣ طبليات بيبي» أو «كرتونتين» ===== */
const WORD_NUM={};
[['نص',0.5],['نصف',0.5],['واحد',1],['وحدة',1],['اثنين',2],['اتنين',2],['ثنتين',2],
 ['ثلاثة',3],['ثلاث',3],['تلاتة',3],['تلات',3],['اربعة',4],['اربع',4],['خمسة',5],['خمس',5],
 ['ستة',6],['ست',6],['سبعة',7],['سبع',7],['ثمانية',8],['تمانية',8],['تمان',8],['تسعة',9],['تسع',9],
 ['عشرة',10],['عشر',10],['دستة',12],['درزن',12],['عشرين',20],['ثلاثين',30],['خمسين',50],
 ['مية',100],['مئة',100]].forEach(([k,v])=>{ WORD_NUM[norm(k)]=v; });
/* المثنى: كرتونتين = 2 */
function dualWord(w){
  return /تين$|تان$/.test(w) && w.length>4;
}
function wordToNum(tok){
  const t=norm(tok);
  if(WORD_NUM[t]!==undefined) return WORD_NUM[t];
  if(dualWord(t)) return 2;
  return null;
}

/* يشيل ترويسة الواتس [تاريخ, وقت] اسم: */
function stripHeader(line){
  let date='';
  const m=line.match(/^\[?\s*(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})[,\s]/);
  if(m){let y=+m[3]; if(y<100)y+=2000;
    date=`${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}
  line=line.replace(/^\[?\s*\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}[,\s]+\d{1,2}:\d{2}(?::\d{2})?\s*(?:[APap]\.?[Mm]\.?|ص|م)?\s*\]?\s*[-–]?\s*/,'');
  const c=line.indexOf(':');
  if(c>0&&c<40&&!/\d/.test(line.slice(0,c))) line=line.slice(c+1);
  return {text:line.trim(),date};
}

/* البحث عن الصنف بالكتالوج: مطابقة تامة ← مرادف ← احتواء ← تشابه */
function findItem(raw){
  const k=key(raw); if(!k) return null;
  /* 1) تصحيح متعلَّم من تعديلاتك السابقة */
  const L=learned(raw); if(L) return L;
  /* 2) تطابق تام */
  for(const it of items){
    if(key(labelOf(it))===k||key(it.name)===k) return it;
    if((it.aliases||[]).some(a=>key(a)===k)) return it;
  }
  /* 3) احتواء + تشابه ضبابي */
  let best=null,bs=0;
  const cands=[];
  for(const it of items){
    cands.push([key(labelOf(it)),it]);
    cands.push([key(it.name),it]);
    (it.aliases||[]).forEach(a=>cands.push([key(a),it]));
  }
  for(const [ck,it] of cands){
    if(!ck) continue;
    let sc=0;
    if(ck===k) sc=1;
    else if(ck.includes(k)||k.includes(ck))
      sc=0.72*Math.min(ck.length,k.length)/Math.max(ck.length,k.length)+0.2;
    else sc=sim(ck,k)*0.9;
    if(sc>bs){bs=sc;best=it;}
  }
  return bs>=0.62?best:null;
}

/* أقرب الأصناف — لاقتراحها على المستخدم */
function suggestItems(raw,n=3){
  const k=key(raw); if(!k) return [];
  const seen=new Set(),out=[];
  items.forEach(it=>{
    const s1=Math.max(sim(key(it.name),k),sim(key(labelOf(it)),k),
      ...(it.aliases||[]).map(a=>sim(key(a),k)));
    out.push({it,s:s1});
  });
  return out.sort((x,y)=>y.s-x.s).filter(o=>o.s>=0.45)
    .filter(o=>{const L=labelOf(o.it); if(seen.has(L))return false; seen.add(L); return true;})
    .slice(0,n).map(o=>o.it);
}

/* الاسم الكامل للتمييز: «اثينا مشوي 14ك» — والعرض يستخدم name لحاله */
function labelOf(it){
  if(!it) return '';
  if(it.label) return it.label;
  const sz=(it.size===null||it.size===undefined)?'':it.size;
  return (it.name+' '+sz+(it.unit||'')).replace(/\s+/g,' ').trim();
}
/* وصف مختصر للحجم: «14ك» */
function sizeText(it){
  if(!it) return '';
  const sz=(it.size===null||it.size===undefined)?'':it.size;
  return sz===''&&!it.unit ? '' : (sz+''+(it.unit||''));
}

/* حجم العبوة: الكتالوج فيه base/size/unit جاهزين، ومنرجع لتحليل الاسم لو ناقصين */
function itemSize(nameOrItem){
  if(nameOrItem && typeof nameOrItem==='object'){
    return {base:key(nameOrItem.base||nameOrItem.name),
            size:(nameOrItem.size===undefined?null:nameOrItem.size),
            unit:nameOrItem.unit||''};
  }
  const n=norm(nameOrItem);
  const m=n.match(/(\d+(?:\.\d+)?)\s*(كغم|كجم|كغ|كيلو|لتر|غم|غ|ل|ك)(?![\u0600-\u06FF])/);
  if(!m) return {base:key(n),size:null,unit:''};
  return {base:key(n.replace(m[0],' ')),size:parseFloat(m[1]),unit:m[2]};
}

/* السعر حسب نوع السند — هاي أهم قاعدة بالنظام */
function priceOf(it,voucher){
  if(!it) return '';
  const out=(it.priceOut===null||it.priceOut===undefined)?null:+it.priceOut;
  const inn=(it.priceIn ===null||it.priceIn ===undefined)?null:+it.priceIn;
  const want=(voucher==='إدخال')?inn:out;
  const other=(voucher==='إدخال')?out:inn;
  if(want!==null) return {price:want,fallback:false};
  if(other!==null) return {price:other,fallback:true};
  return {price:'',fallback:false};
}

/* مطابقة تراعي حجم العبوة: "بيبي" + [3,10] -> "بيبي 10ك" */
function matchSized(base,cands,unit,strictSize){
  const bk=key(base);
  if(!bk) return null;
  const pool=items.map(it=>({it,inf:itemSize(it)}));

  let fam=pool.filter(o=>o.inf.base===bk);
  if(!fam.length) fam=pool.filter(o=>o.inf.base&&(o.inf.base.includes(bk)||bk.includes(o.inf.base))
     && Math.min(o.inf.base.length,bk.length)/Math.max(o.inf.base.length,bk.length)>=0.6);
  /* تشابه ضبابي على الاسم الأساسي: «توم» -> «ثوم».
     الكلمات القصيرة حرف واحد غلط فيها طبيعي، فالعتبة بتتساهل معها. */
  if(!fam.length){
    let bb=0,bn=null,bd=99;
    pool.forEach(o=>{
      const sc=sim(o.inf.base,bk), dd=lev(o.inf.base,bk);
      if(sc>bb){bb=sc;bn=o.inf.base;bd=dd;}
    });
    const okShort = bk.length<=5 && bd<=1;     /* كلمة قصيرة + حرف واحد فرق */
    const okLong  = bk.length>5  && (bb>=0.7 || bd<=2);
    if(bn && (okShort||okLong)) fam=pool.filter(o=>o.inf.base===bn);
  }
  if(!fam.length){
    for(const it of items) for(const a of (it.aliases||[]))
      if(key(a)===bk){ return it; }
  }
  if(!fam.length) return strictSize?null:findItem(base);

  for(const c of (cands||[])){
    const hit=fam.find(o=>o.inf.size===c);
    if(hit) return hit.it;
  }
  /* الحجم مذكور صراحة بس مش موجود بالقائمة — ممنوع نخمّن حجم ثاني */
  if(strictSize) return null;
  if(fam.length===1) return fam[0].it;
  return null;   // عائلة بأحجام متعددة وما تحدد الحجم — ننبّه المستخدم
}

/* يقرأ سطر واحد → بند */
function parseLine(rawLine,ctx){
  const h=stripHeader(rawLine);
  let line=h.text;
  if(!line) return null;
  if(h.date) ctx.date=h.date;

  const n=norm(line);
  if(!n) return null;

  /* سطر يحدد اليوم فقط (مع تحمّل أخطاء إملائية) */
  const dOnly=n.replace(/[^\u0600-\u06FF ]/g,'').trim();
  if(DAYS[dOnly]){ ctx.day=DAYS[dOnly]; return null; }
  if(dOnly && dOnly.length<=9 && !/\d/.test(n)){
    for(const dk in DAYS){ if(sim(key(dk),key(dOnly))>=0.8){ ctx.day=DAYS[dk]; return null; } }
  }

  /* أسئلة واستفسارات — مش سندات */
  if(QUESTION.test(n)) return null;

  /* إلغاء/تصحيح: بيشيل آخر بند انضاف */
  if(CANCEL_W.test(n)){ ctx.cancelLast=true; return null; }

  /* سطر يحدد نوع السند */
  /* \b لا يشتغل مع العربية بالجافاسكربت — منستخدم حدود يدوية */
  const AB='[^\\u0600-\\u06FF\\w]';
  const hasWord=w=>new RegExp('(?:^|'+AB+')'+w).test(n);
  const isOut=OUT_W.some(hasWord);
  const isIn =IN_W.some(hasWord);
  if((isOut||isIn) && !/\d/.test(n.replace(/\d+[\/\-.]\d+/g,''))){
    ctx.voucher=isOut?'إخراج':'إدخال'; return null;
  }
  if(isOut) ctx.voucher='إخراج'; else if(isIn) ctx.voucher='إدخال';

  if(NOISE.test(n)) return null;
  if(!/\d/.test(n)) return null;

  /* اليوم مذكور داخل السطر */
  for(const d in DAYS) if(n.includes(norm(d))){ ctx.day=DAYS[d]; break; }

  let body=n;
  /* تحويل الأعداد المكتوبة بالحروف لأرقام: «ثلاث كراتين» -> «3 كراتين» */
  body=body.split(' ').map(t=>{ const v=wordToNum(t); return v===null?t:String(v); }).join(' ');
  OUT_W.concat(IN_W).forEach(w=>{
    body=body.replace(new RegExp('(?:^|'+AB+')'+w+'[\\u0600-\\u06FF]*','g'),' ');});
  body=body.replace(/(?:^|[^\u0600-\u06FF])(?:سند|فاتوره|فاتورة|رقم|بتاريخ|اليوم|امس|تم|تمت|قمنا|كميه|عدد|بس|كمان|زياده|ايضا|و?كمان|لعند|عند|من|الى|الي|على|عن|في|مع|يعني|تقريبا|حوالي|بالضبط|فقط|جديد|قديم|صافي|اجمالي|المجموع|بدون|شامل)(?![\u0600-\u06FF])/g,' ')
           .replace(/\b\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?\b/g,' ')
           .replace(/\s+/g,' ').trim();
  if(!body||!/\d/.test(body)) return null;

  const notes=[];
  let item='',qty='',weight='',price='',textTotal='',master=null,statedSize=null;

  /* صيغة الشرطات: الصنف - عدد - حجم - سعر */
  const parts=body.split(/\s*[-–—|،,]\s*/).filter(Boolean);
  const dashed = parts.length>=3 && isNaN(parseFloat(parts[0]));

  if(dashed){
    let base=parts[0].trim();
    qty=parseFloat(parts[1]);
    const size=parseFloat(parts[2]);
    if(parts[3]!==undefined) price=parseFloat(parts[3]);
    if(parts[4]!==undefined) textTotal=parseFloat(parts[4]);
    const brD=applyBusinessRules(base);
    base=brD.name; brD.notes.forEach(x=>notes.push(x));
    master=matchSized(base,isNaN(size)?[]:[size],'',!isNaN(size));
    if(!isNaN(size)) statedSize=size;
    if(!master && isNaN(size)){
      const ds=defaultSizeFor(base);
      if(ds!==null){ master=matchSized(base,[ds],'',true);
        if(master) notes.push(`اعتمدت الحجم الافتراضي ${ds}ك`); }
    }
    weight=isNaN(size)?'':size;
    item=master?master.name:base;
  } else {
    /* نجمع كل الأرقام؛ الأرقام الملاصقة لوحدة (ك10 / 25ك) أولوية كحجم عبوة،
       والكتالوج هو اللي بيقرر أي رقم هو الحجم فعلًا. */
    let b=body;
    const UNIT='كغم|كجم|كغ|كيلو|لتر|غم|غ|ل|ك';
    const sized=[];
    /* «ك2.5» أولًا: وحدة ملتصقة برقم بعدها — أوضح إشارة للحجم */
    b=b.replace(new RegExp('(?:^|\\s)('+UNIT+')(\\d+(?:[.,]\\d+)?)','g'),(m,u,d)=>{
      sized.push(parseFloat(d.replace(',','.'))); return ' '; });
    /* «25ك»: رقم ملتصق بوحدة بعده، وما بعدها حرف عربي ولا رقم */
    b=b.replace(new RegExp('(\\d+(?:[.,]\\d+)?)('+UNIT+')(?![\\u0600-\\u06FF0-9])','g'),(m,d)=>{
      sized.push(parseFloat(d.replace(',','.'))); return ' '; });

    b=b.replace(/[×xX*]/g,' ')
        .replace(/(\d)([\u0600-\u06FF])/g,'$1 $2').replace(/([\u0600-\u06FF])(\d)/g,'$1 $2');
    const toks=b.split(/\s+/).filter(Boolean);
    const plain=[],words=[];
    toks.forEach(t=>{ const v=parseFloat(t.replace(',','.'));
      if(!isNaN(v)&&/^[\d.,]+$/.test(t)) plain.push(v); else words.push(t); });
    let base=words.join(' ').trim();

    /* قواعد العمل: توحيد المرادفات وحذف الأوصاف (سوبر/اكسترا) */
    const br=applyBusinessRules(base);
    base=br.name; br.notes.forEach(x=>notes.push(x));

    /* الحجم الملاصق لوحدة (ك2.5) قاطع؛ ما منجرب غيره */
    master = sized.length ? matchSized(base,sized,'',true) : null;
    if(sized.length) statedSize=sized[0];
    if(!master && !sized.length) master=matchSized(base,plain);
    /* حجم افتراضي لأصناف معروفة: المكدوس دائمًا 4ك إذا ما انذكر حجم */
    if(!master && !sized.length){
      const ds=defaultSizeFor(base);
      if(ds!==null){
        master=matchSized(base,[ds],'',true);
        if(master) notes.push(`اعتمدت الحجم الافتراضي ${ds}ك`);
      }
    }

    let size='';
    if(master){
      const ms=itemSize(master).size;
      if(ms!==null){
        size=ms;
        /* لو الحجم جا من رقم ملاصق لوحدة (ك10) فهو مشال أصلًا من plain.
           غير هيك لازم نشيله من الأعداد حتى لا يُحسب كعدد. */
        if(!sized.includes(ms)){
          const i=plain.indexOf(ms);
          if(i>=0) plain.splice(i,1);
        }
      }
    } else if(sized.length){ size=sized[0]; }

    weight=size===''?'':size;
    if(plain.length>=1) qty=plain[0];
    if(plain.length>=2) price=plain[1];
    if(plain.length>=3) textTotal=plain[2];
    item=master?master.name:base;
  }

  if(item==='' && (qty===''||isNaN(qty))) return null;

  /* السعر من قائمة الأسعار دائمًا، وحسب نوع السند */
  /* لو المستخدم كتب حجم صريح وما لقيناه، ممنوع نخمّن صنف بحجم ثاني */
  if(!master && item && statedSize===null) master=findItem(item);
  if(!master && statedSize!==null && weight==='') weight=statedSize;
  let unit='';
  if(master){
    item=master.name; unit=master.unit||'';
    const inf=itemSize(master);
    if(inf.size!==null) weight=inf.size;
    const pr=priceOf(master,ctx.voucher);
    if(pr.price===''){
      notes.push('⚠️ ما في سعر لهذا الصنف بالقائمة');
      price='';
    }else{
      if(pr.fallback) notes.push(`ما في سعر ${ctx.voucher} — استخدمت السعر الثاني`);
      if(price!==''&&!isNaN(price)&&Math.abs(pr.price-(+price))>0.001)
        notes.push(`السعر بالنص ${price} — المعتمد ${pr.price}`);
      price=pr.price;
    }
  } else if(item){
    const bk=key(item);
    const fam=items.filter(it=>{const b=itemSize(it).base;
      return b&&(b===bk||b.includes(bk)||bk.includes(b));});
    if(fam.length){
      const sizes=fam.map(f=>sizeText(f)).filter(Boolean).join(' / ');
      notes.push(weight!==''&&!isNaN(weight)
        ? `⚠️ ما في «${item} ${weight}${unit||''}» بالقائمة — المتوفر: ${sizes}`
        : `⚠️ حدّد الحجم: ${sizes}`);
    }
    else {
      const sug=suggestItems(item,3);
      notes.push(sug.length
        ? `⚠️ صنف غير موجود — قصدك: ${sug.map(x=>labelOf(x)).join(' / ')}؟`
        : '⚠️ صنف غير موجود بقائمة الأسعار');
    }
  }
  if(!item) notes.push('اسم الصنف غير واضح');
  if(qty===''||isNaN(qty)){ qty=''; notes.push('العدد ناقص'); }
  if(weight===''||isNaN(weight)) weight='';
  if(price===''||isNaN(price)){ price=''; notes.push('السعر ناقص'); }

  const r={id:uid(),day:ctx.day||dayNameOf(ctx.date),item,base:(master&&master.base)||item,
    qty,weight,unit,price,total:'',notes:'',original:h.text};
  calcTotal(r);
  if(textTotal!==''&&!isNaN(textTotal)&&r.total!==''&&Math.abs(textTotal-r.total)>0.01)
    notes.push(`الإجمالي بالنص ${textTotal} ≠ المحسوب ${fx(r.total)}`);
  r.notes=notes.join(' • ');
  return r;
}

function calcTotal(r){
  const q=parseFloat(r.qty), p=parseFloat(r.price);
  r.total=(!isNaN(q)&&!isNaN(p))?+(q*p).toFixed(4):'';
}

/* ==========================================================
   المحرك الذكي (Groq / Qwen / Kimi)
   ملاحظة أمان مهمة: السعر ما بيجي من الذكاء الاصطناعي أبدًا —
   بس بيحدد اسم الصنف والعدد، والسعر بيتقرر من قائمة أسعارك.
   ========================================================== */

  groq:{label:'Groq',url:'https://api.groq.com/openai/v1/chat/completions',
        model:'llama-3.3-70b-versatile',
        vision:'meta-llama/llama-4-scout-17b-16e-instruct',keyHint:'gsk_...'},
  qwen:{label:'Qwen (DashScope)',
        url:'https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions',
        model:'qwen-plus',vision:'qwen-vl-max',keyHint:'sk-...'},
  kimi:{label:'Kimi (Moonshot)',url:'https://api.moonshot.ai/v1/chat/completions',
        model:'kimi-k2-0711-preview',vision:'moonshot-v1-8k-vision-preview',keyHint:'sk-...'},
};

try{ Object.keys(settings.ai.models||{}).forEach(k=>{
  if(AI_PROVIDERS[k]&&settings.ai.models[k]) AI_PROVIDERS[k].model=settings.ai.models[k]; }); }catch(e){}

function aiPrompt(txt,dayHint){
  const names=items.map(i=>labelOf(i));
  return `أنت مساعد يقرأ رسائل واتساب عربية عامية لمستودع مواد غذائية ويحولها لبنود منظمة.

قائمة الأصناف المعتمدة (اختر الاسم الأقرب منها حرفيًا وانسخه كما هو):
${names.join(' | ')}

قواعد إلزامية:
1. أعد JSON فقط، بدون أي شرح، بهذا الشكل:
{"voucher":"إخراج أو إدخال","lines":[{"day":"","item":"","qty":0,"note":""}]}
2. "item" يجب أن يكون منسوخًا حرفيًا من القائمة أعلاه. لو ما لقيت تطابق، ضع الاسم كما ورد بالنص وضع في note كلمة "غير معروف".
3. انتبه لحجم العبوة: "بيبي ك10" أو "بيبي 10ك" تعني الصنف "بيبي 10ك" وليس كمية 10.
4. "qty" هو عدد العبوات فقط (رقم). لا تضع الأسعار إطلاقًا.
5. تجاهل عبارات المجاملة والتحية والرسائل غير المتعلقة بالبضاعة.
6. لو ذُكر اسم يوم (السبت، الأحد...) اجعله قيمة day للبنود التي تليه.
7. لو الرسالة فيها كلمة إدخال/وارد/استلمنا اجعل voucher = "إدخال"، ولو إخراج/طلعنا/سحب اجعلها "إخراج".

اليوم الافتراضي: ${dayHint||'غير محدد'}

النص:
"""${txt}"""`;
}

/* برومبت الصور: سند مكتوب بخط اليد أو مطبوع */
function visionPrompt(){
  const names=items.map(i=>labelOf(i));
  return `في الصورة سند أو فاتورة مستودع (مطبوعة أو بخط اليد أو لقطة واتساب).
اقرأ كل البنود بدقة وأعد JSON فقط.

قائمة الأصناف المعتمدة (انسخ الاسم الأقرب حرفيًا):
${names.join(' | ')}

الشكل المطلوب:
{"voucher":"إخراج أو إدخال","date":"YYYY-MM-DD أو فارغ","lines":[
  {"day":"","item":"","qty":0,"unit":"","note":""}]}

قواعد إلزامية:
1. "item" = اسم الصنف كما ظهر بالفاتورة بالضبط (بدون تفسير).
   لو غير واضح ضع note="غير واضح".
2. "qty" = الرقم الموجود بعمود «الكمية / Qty» كما هو حرفيًا.
   لا تحوّله ولا تحسبه.
3. "unit" = ما هو مكتوب بعمود «الوحدة / Unit» حرفيًا.
4. لا تستخرج أسعار ولا مجاميع ولا ضرائب إطلاقًا — عندنا أسعارنا بالنظام.
5. تجاهل: الترويسة، الرقم الضريبي، رمز الصنف، الأختام، التواقيع،
   وسطور المجاميع بالأسفل.
6. الصفوف الفارغة تُتجاهل. لا تخترع بنود.`;
}

/* من عائلة الصنف: اختر الحجم اللي بيقسّم الكيلوات لعدد صحيح */
function bestSizeFor(baseName,kg,preferred){
  const bk=key(baseName);
  const fam=items.filter(it=>key(it.base||it.name)===bk && it.size);
  if(!fam.length) return null;
  /* لو الحجم المفضّل بيقسم تمام، خليه */
  if(preferred){
    const n=kg/preferred;
    if(Math.abs(n-Math.round(n))<0.02) return fam.find(f=>f.size===preferred)||null;
  }
  /* غير هيك دوّر على حجم بيقسّم لعدد صحيح — والأكبر أولًا (أقل عبوات) */
  const exact=fam.filter(f=>{ const n=kg/f.size; return Math.abs(n-Math.round(n))<0.02 && Math.round(n)>=1; })
                 .sort((a,b)=>b.size-a.size);
  return exact[0]||null;
}

/* الفاتورة بتعطي كيلوات — منحوّلها لعدد عبوات حسب حجم العبوة بالقائمة */
function packsFromInvoiceLine(master,qtyRaw,unitTxt,itemTxt,notes){
  const qty=parseFloat(qtyRaw);
  if(isNaN(qty)) return '';
  /* «مرتبان/عبوة» يعني العدد صريح، ما بنحوّل */
  if(unitIsPieces(unitTxt,itemTxt)) return qty;
  if(!master) return qty;
  const size=itemSize(master).size;
  const unit=(master.unit||'');
  /* الوحدة بالقائمة كيلو والفاتورة بالكيلو -> نقسم */
  if(size && (unit==='ك'||unit==='')){
    const r=kgToPacks(qty,size);
    if(r){
      if(!r.exact) notes.push(`⚠️ ${qty}كغ ÷ ${size}ك = ${r.packs} — مش عدد صحيح، راجعه`);
      else notes.push(`${qty}كغ ÷ ${size}ك = ${r.packs} عبوة`);
      return r.packs;
    }
  }
  return qty;
}

async function aiVision(dataUrl){
  const p=AI_PROVIDERS[settings.ai.provider];
  const k=(settings.ai.keys||{})[settings.ai.provider];
  if(!p) throw new Error('مزوّد غير معروف');
  if(!k) throw new Error('ما في مفتاح API محفوظ لهذا المزوّد');
  const model=(settings.ai.visionModels&&settings.ai.visionModels[settings.ai.provider])||p.vision;
  if(!model) throw new Error('هذا المزوّد ما بيدعم تحليل الصور');
  const res=await fetch(p.url,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},
    body:JSON.stringify({model,temperature:0,max_tokens:4000,
      messages:[{role:'user',content:[
        {type:'text',text:visionPrompt()},
        {type:'image_url',image_url:{url:dataUrl}}
      ]}]})});
  if(!res.ok){
    let m=''; try{const j=await res.json();m=j.error?.message||JSON.stringify(j).slice(0,200);}catch(e){m='HTTP '+res.status;}
    if(res.status===401||res.status===403) throw new Error('المفتاح غير صحيح أو منتهي ('+res.status+')');
    if(res.status===413) throw new Error('الصورة كبيرة — جرّب صورة أصغر');
    throw new Error(m);
  }
  const j=await res.json();
  return {data:extractJSON(j.choices?.[0]?.message?.content||''),usage:j.usage};
}

async function aiAnalyze(txt,dayHint){
  const p=AI_PROVIDERS[settings.ai.provider];
  const k=(settings.ai.keys||{})[settings.ai.provider];
  if(!p) throw new Error('مزوّد غير معروف');
  if(!k) throw new Error('ما في مفتاح API محفوظ لهذا المزوّد');
  const res=await fetch(p.url,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},
    body:JSON.stringify({model:p.model,temperature:0,
      messages:[{role:'user',content:aiPrompt(txt,dayHint)}],
      response_format:{type:'json_object'}})});
  if(!res.ok){
    let m=''; try{const j=await res.json();m=j.error?.message||JSON.stringify(j).slice(0,200);}catch(e){m='HTTP '+res.status;}
    if(res.status===401||res.status===403) throw new Error('المفتاح غير صحيح أو منتهي ('+res.status+')');
    throw new Error(m);
  }
  const j=await res.json();
  const raw=j.choices?.[0]?.message?.content||'';
  return {data:extractJSON(raw),usage:j.usage};
}

function extractJSON(t){
  t=String(t||'').trim();
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw new Error('النموذج ما رجّع JSON صالح');
}

/* يحوّل مخرجات الذكاء الاصطناعي لبنود — مع فرض السعر من القائمة */
function rowsFromAI(data,ctx){
  const out=[];
  (data.lines||[]).forEach(l=>{
    const notes=[];
    const rawName=String(l.item||'').trim();
    if(!rawName && (l.qty===undefined||l.qty==='')) return;   /* صف فاضي */

    /* قواعد العمل: توحيد المرادفات + إهمال «سوبر/اكسترا» */
    const br=applyBusinessRules(rawName);
    let name=br.name; br.notes.forEach(x=>notes.push(x));

    let master=findItem(name)||matchSized(name,[]);
    if(!master){
      const inf=itemSize(name);
      if(inf.size!==null) master=matchSized(inf.base,[inf.size],'',true);
    }
    /* حجم افتراضي (المكدوس 4ك) */
    if(!master){
      const inf=itemSize(name);
      const ds=defaultSizeFor(inf.size!==null?inf.base:name);
      if(ds!==null){
        master=matchSized(inf.size!==null?inf.base:name,[ds],'',true);
        if(master) notes.push(`اعتمدت الحجم الافتراضي ${ds}ك`);
      }
    }

    /* الكمية: الفاتورة بالكيلو -> عدد عبوات، إلا لو الوحدة «مرتبان» */
    const kg=parseFloat(l.qty);
    const pieces=unitIsPieces(l.unit,rawName);
    /* لو بالكيلو: اختَر حجم العبوة اللي بيقسّم الكيلوات لعدد صحيح */
    if(!pieces && !isNaN(kg)){
      const famBase=(master&&(master.base||master.name))||itemSize(name).base||name;
      /* الحجم الافتراضي المعتمد (المكدوس 4ك) له الأولوية */
      const dflt=defaultSizeFor(famBase);
      const pref=dflt ?? (master?itemSize(master).size:null);
      const better=bestSizeFor(famBase,kg,pref);
      if(better && (!master || better.size!==itemSize(master).size)){
        if(master) notes.push(`اخترت عبوة ${sizeText(better)} لأن ${kg}كغ بتقسّم عليها تمام`);
        master=better;
      }
      /* الصنف إله حجم معتمد بس الكيلوات ما بتقسّم عليه -> نثبّت الحجم المعتمد وننبّه،
         بدل ما نختار عبوة غريبة ونطلّع سعر خيالي */
      if(dflt && (!master || itemSize(master).size!==dflt)){
        const fixed=matchSized(famBase,[dflt],'',true);
        if(fixed){
          master=fixed;
          const n=kg/dflt;
          notes.push(`⚠️ ${kg}كغ ÷ ${dflt}ك = ${(+n.toFixed(3))} — مش عدد صحيح، راجعه`);
        }
      }
    }
    let qty=packsFromInvoiceLine(master,l.qty,l.unit,rawName,notes);

    let price='';
    if(master){
      if(key(labelOf(master))!==key(rawName) && key(master.name)!==key(rawName)
         && !notes.some(x=>x.startsWith('وحّدته')))
        notes.push('طابقته مع: '+labelOf(master));
      name=master.name;
      const pr=priceOf(master,ctx.voucher);
      if(pr.price===''){ notes.push('⚠️ ما في سعر لهذا الصنف بالقائمة'); }
      else{ if(pr.fallback) notes.push(`ما في سعر ${ctx.voucher} — استخدمت السعر الثاني`);
            price=pr.price; }
    }else{
      const sug=suggestItems(name,3);
      notes.push(sug.length?`⚠️ صنف غير موجود — قصدك: ${sug.map(x=>labelOf(x)).join(' / ')}؟`
                           :'⚠️ صنف غير موجود بقائمة الأسعار');
    }
    if(qty===''||isNaN(qty)){qty='';notes.push('العدد ناقص');}
    if(l.note) notes.push(String(l.note));
    const inf=master?itemSize(master):{size:null};
    const r={id:uid(),day:l.day||ctx.day||dayNameOf(ctx.date||draft.date),item:name,
      base:(master&&master.base)||name,qty,
      weight:inf.size===null?'':inf.size,unit:(master&&master.unit)||'',
      price,total:'',notes:'',original:'[AI] '+JSON.stringify(l)};
    calcTotal(r);
    r.notes=[...new Set(notes)].join(' • ');   /* بدون تكرار */
    out.push(r);
  });
  return out;
}

function parseText(txt,startDay,startVoucher,startDate){
  const ctx={day:startDay||'',voucher:startVoucher||'إخراج',date:startDate||todayStr(),cancelLast:false};
  const out=[],skipped=[];
  txt.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const before=ctx.cancelLast;
    const r=parseLine(line,ctx);
    /* «الغاء/غلط» بيشيل آخر بند انضاف */
    if(!before && ctx.cancelLast){
      const rm=out.pop();
      ctx.cancelLast=false;
      if(rm) skipped.push('(ألغي) '+rm.original);
      return;
    }
    if(r) out.push(r);
    else{ const h=stripHeader(line); const nn=norm(h.text);
      if(/\d/.test(h.text)&&!NOISE.test(nn)&&!QUESTION.test(nn)&&!DAYS[nn]) skipped.push(h.text); }
  });
  return {rows:out,skipped,ctx};
}

/* تجزئة كلمة السر — مش تشفير بنكي، بس أحسن من تخزينها نص صريح */
async function hashPw(pw,salt){
  const data=new TextEncoder().encode(String(salt||'')+'::'+String(pw));
  try{
    const buf=await crypto.subtle.digest('SHA-256',data);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0; const t=salt+'::'+pw;
    for(let i=0;i<t.length;i++){ h=((h<<5)-h+t.charCodeAt(i))|0; }
    return 'x'+Math.abs(h).toString(16);
  }
}
function newSalt(){ return Math.random().toString(36).slice(2,10); }

async function ensureAdmin(){
  const u=usersList();
  let changed=false;
  for(const x of u){
    if(x.seedPw){
      x.salt=newSalt();
      x.hash=await hashPw(x.seedPw,x.salt);
      x.shown=x.seedPw;             /* نسخة ظاهرة للمدير حسب طلبه */
      x.setBy='المدير';
      delete x.seedPw;
      x.mustChange=false;
      changed=true;
    }
  }
  /* شبكة أمان: لو ما ضل ولا مدير */
  if(!u.some(x=>x.role==='admin')){
    const salt=newSalt();
    u.push({id:uid(),user:'admin',name:'المدير',role:'admin',customer:'',
            salt,hash:await hashPw('admin',salt),mustChange:true});
    changed=true;
  }
  if(changed) saveSet();
}

  const w=weekBounds(dateStr);
  return w[0];                        /* تاريخ السبت = مفتاح الأسبوع */

function isPublished(customer,dateStr){

       ['alerts','🔔 الإشعارات'+bdg(nb)],
       ['settings','⑤ الإعدادات والنسخ']]
    : [['report','📄 كشف حسابي'],['invoices','🧾 سنداتي'],
       ['ledger','🧮 كشف حساب لزبوني'],
       ['messages','💬 الرسائل'+bdg(mb)],
       ['alerts','🔔 الإشعارات'+bdg(nb)],
       ['account','👤 حسابي']];
  return TABS;
}

function go(t){

  try{ window.scrollTo(0,0); }catch(e){}
}

/* ===== الدرج الجانبي ===== */
function setNav(open){
  try{
    document.body.classList.toggle('navClosed',!open);
    const n=$('navNotch');
    if(n){ n.textContent = open?'❯':'❮';
           n.title = open?'إخفاء القائمة':'إظهار القائمة'; }
    localStorage.setItem('wh_nav_open', open?'1':'0');
  }catch(e){}
}
function toggleNav(){ setNav(document.body.classList.contains('navClosed')); }
function initNav(){
  let open=true;
  try{
    const v=localStorage.getItem('wh_nav_open');
    if(v!==null) open=(v==='1');
    else if(window.innerWidth<=900) open=false;   // الموبايل يبدأ مسكّر
  }catch(e){}

}

/* ============ 💬 الرسائل ============ */
let msgWith='';
function vMessages(){
  const me=String(SESSION.user).toLowerCase();
  const others=usersList().filter(u=>String(u.user).toLowerCase()!==me);
  if(!msgWith && others.length) msgWith=others[0].user;
  const peer=String(msgWith).toLowerCase();
  const thread=msgs.filter(m=>{
    const a=String(m.from).toLowerCase(), b=String(m.to).toLowerCase();
    return (a===me&&b===peer)||(a===peer&&b===me);
  }).sort((x,y)=>String(x.at).localeCompare(String(y.at)));
  /* علّم رسائل هالمحادثة كمقروءة */
  let ch=false;
  msgs.forEach(m=>{ if(String(m.to).toLowerCase()===me&&String(m.from).toLowerCase()===peer&&!m.read){m.read=true;ch=true;} });
  if(ch){ saveMsgs(); buildTabs(); }

  const unreadFrom=u=>msgs.filter(m=>String(m.to).toLowerCase()===me
      && String(m.from).toLowerCase()===String(u).toLowerCase() && !m.read).length;

  $('view').innerHTML=`
  <div class="card">
    <h2>💬 الرسائل</h2>
    <p class="hint">مراسلة مباشرة بين أعضاء النظام.</p>
    <div class="row">${others.map(u=>{
      const n=unreadFrom(u.user);
      return `<button class="btn ${String(u.user).toLowerCase()===peer?'':'sec'} sm"
        onclick="msgWith='${esc(u.user)}';vMessages()">${esc(u.name||u.user)}${n?` <span class="badgeN">${n}</span>`:''}</button>`;
    }).join('')||'<span class="mut">ما في أعضاء آخرين</span>'}</div>
  </div>
  <div class="card">
    <div class="chatBox" id="chatBox">
      ${thread.length?thread.map(m=>`
        <div class="bubble ${String(m.from).toLowerCase()===me?'mine':'theirs'}">
          <div class="bTxt">${esc(m.text)}</div>
          <div class="bMeta">${esc(m.t)}</div>
        </div>`).join('')
        :'<div class="mut" style="text-align:center;padding:24px">ما في رسائل بعد — ابدأ المحادثة 👋</div>'}
    </div>
    <div class="row" style="margin-top:12px">
      <input id="msgTxt" placeholder="اكتب رسالتك…" style="flex:1;min-width:200px"
             onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="btn" onclick="sendMsg()">إرسال</button>
    </div>
  </div>`;
  const cb=$('chatBox'); if(cb) cb.scrollTop=cb.scrollHeight;
}
function sendMsg(){
  const el=$('msgTxt'); if(!el) return;
  const t=el.value.trim(); if(!t) return;
  if(!msgWith){ notify('اختر عضو أولًا','warn'); return; }
  msgs.push({id:uid(),from:SESSION.user,fromName:SESSION.name,to:msgWith,
    text:t,read:false,at:new Date().toISOString(),t:new Date().toLocaleString('ar-JO')});
  if(msgs.length>2000) msgs.splice(0,msgs.length-2000);
  saveMsgs();
  notifyUser(msgWith,'رسالة جديدة من '+SESSION.name,t.slice(0,80),'msg','messages');
  el.value=''; vMessages(); buildTabs(); render();
}

function pickClient(n){ ledClient=n; vLedger();
  setTimeout(()=>{ const b=$('ledBox'); if(b) try{b.scrollIntoView({behavior:'smooth'})}catch(e){} },60); }

async function addLedClient(){
  const ok=await ask({title:'زبون جديد',ok:'إضافة',
    body:`<label>اسم الزبون *</label><input id="__lc" class="mInput" placeholder="اسم المحل أو الشخص">
      <label style="margin-top:8px">رقم الهاتف</label><input id="__lp" class="mInput" placeholder="07…">
      <label style="margin-top:8px">ملاحظة</label><input id="__ln" class="mInput" placeholder="العنوان أو أي تفصيل">`});
  if(!ok) return;
  const V=(ok&&ok.vals)||{};
  const n=String(V.__lc||'').trim();
  if(!n){ notify('اكتب اسم الزبون','warn'); return; }
  if(ledgerClients().some(x=>key(x)===key(n))){ notify('الزبون موجود عندك','warn'); ledClient=n; return vLedger(); }
  lclients.push({id:uid(),owner:SESSION.user,name:n,
    phone:String(V.__lp||'').trim(),note:String(V.__ln||'').trim(),
    at:new Date().toISOString()});
  saveLClients(); ledClient=n; ledQ=''; vLedger();
  notify('✅ انضاف الزبون','ok');
}

async function editClient(name){
  const r=clientRec(name)||{name,phone:'',note:''};
  const ok=await ask({title:'تعديل بيانات الزبون',ok:'حفظ',
    body:`<label>اسم الزبون *</label><input id="__lc" class="mInput" value="${esc(r.name||name)}">
      <label style="margin-top:8px">رقم الهاتف</label><input id="__lp" class="mInput" value="${esc(r.phone||'')}">
      <label style="margin-top:8px">ملاحظة</label><input id="__ln" class="mInput" value="${esc(r.note||'')}">`});
  if(!ok) return;
  const V=(ok&&ok.vals)||{};
  const nn=String(V.__lc||'').trim();
  if(!nn){ notify('الاسم مطلوب','warn'); return; }
  if(key(nn)!==key(name) && ledgerClients().some(x=>key(x)===key(nn))){
    notify('في زبون ثاني بنفس الاسم','warn'); return; }
  let rec=clientRec(name);
  if(!rec){ rec={id:uid(),owner:SESSION.user,name,phone:'',note:'',at:new Date().toISOString()};
            lclients.push(rec); }
  rec.name=nn; rec.phone=String(V.__lp||'').trim(); rec.note=String(V.__ln||'').trim();
  /* لو الاسم تغيّر، نحدّث حركاته كمان */
  if(nn!==name){
    ledger.forEach(e=>{ if(String(e.owner).toLowerCase()===String(SESSION.user).toLowerCase()
        && e.client===name) e.client=nn; });
    saveLedger();
    if(ledClient===name) ledClient=nn;
  }
  saveLClients(); vLedger(); notify('✅ انحفظت التعديلات','ok');
}

async function delClient(name){
  const t=ledgerTotals(name);
  const ok=await ask({title:'حذف زبون',danger:true,ok:'احذف نهائيًا',
    requireText: t.count?'احذف':null,
    body:`<b>${esc(name)}</b><br><br>
      ${t.count?`⚠️ عنده <b>${t.count}</b> حركة مسجّلة ورصيد
        <b>${fx(Math.abs(t.balance))}</b> — رح تنمسح كل حركاته معه.<br>
        <span class="mut">اكتب «احذف» للتأكيد.</span>`
      :'ما عنده حركات مسجّلة.'}`});
  if(!ok) return;
  const me=String(SESSION.user).toLowerCase();
  const removedRows=ledger.filter(e=>String(e.owner).toLowerCase()===me && e.client===name);
  const removedRec=clientRec(name);
  ledger=ledger.filter(e=>!(String(e.owner).toLowerCase()===me && e.client===name));
  lclients=lclients.filter(c=>!(String(c.owner).toLowerCase()===me && c.name===name));
  saveLedger(); saveLClients();
  toTrash('lclient',`زبون ${name} (${removedRows.length} حركة)`,{rec:removedRec,rows:removedRows});
  if(ledClient===name) ledClient='';
  vLedger();
  const tid=trash[0].id;
  notify(`انحذف ${name}`,'warn',9000,()=>{ restoreTrash(tid); vLedger(); notify('رجع الزبون ✅','ok'); });
}

function addLedRow(){
  if(!ledClient){ notify('اختر زبون أولًا','warn'); return; }
  const dt=$('leD').value||todayStr();
  const dx=($('leX').value||'').trim();
  const db=parseFloat($('leDeb').value)||0;
  const cr=parseFloat($('leCre').value)||0;
  if(!db && !cr){ notify('احط مبلغ بخانة «عليه» أو «له»','warn'); return; }
  ledger.push({id:uid(),owner:SESSION.user,client:ledClient,date:dt,
    desc:dx||(db?'بضاعة':'دفعة'),debit:db,credit:cr,at:new Date().toISOString()});
  saveLedger();
  $('leX').value='';$('leDeb').value='';$('leCre').value='';
  drawLedger(); notify('✅ انضافت الحركة','ok');
}

async function delLedRow(id){
  const e=ledger.find(x=>x.id===id); if(!e) return;
  const ok=await ask({title:'حذف حركة',danger:true,ok:'احذف',
    body:`<b>${esc(e.desc)}</b> — ${esc(e.date)}<br>
      عليه ${fx(e.debit)} · له ${fx(e.credit)}`});
  if(!ok) return;
  ledger=ledger.filter(x=>x.id!==id); saveLedger(); drawLedger();
  notify('انحذفت الحركة','warn');
}

/* الفترة الفعلية: أول وآخر حركة ظاهرة */
function ledPeriod(){
  /* القيد الافتتاحي الصفري ما بيحدد الفترة */
  const R=ledView().filter(e=>(+e.debit||0)||(+e.credit||0));
  if(!R.length) return (ledFrom||ledTo) ? `${ledFrom||'—'} ← ${ledTo||'—'}` : '';
  const ds=R.map(e=>e.date).sort();
  return ds[0]===ds[ds.length-1] ? ds[0] : `${ds[0]} ← ${ds[ds.length-1]}`;
}

function ledView(){
  let R=ledgerRows(ledClient);
  if(ledFrom) R=R.filter(e=>e.date>=ledFrom);
  if(ledTo)   R=R.filter(e=>e.date<=ledTo);
  return R;
}

function drawLedger(){
  const box=$('ledBox'); if(!box) return;
  if(!ledClient){ box.innerHTML='<div class="card">أضف زبون عشان تبدأ كشف حسابه.</div>'; return; }

  let run=0, deb=0, cre=0;
  const body=R.map((e,i)=>{
    const d=+e.debit||0, c=+e.credit||0;

    return `<tr>
      <td>${i+1}</td><td class="lDate">${esc(e.date)}</td>
      <td class="name">${esc(e.desc)}</td>
      <td class="amt vOut">${d?fx(d):''}</td>
      <td class="amt vIn">${c?fx(c):''}</td>
      <td class="amt"><b>${fx(run)}</b></td>
      <td class="noprint"><button class="btn danger sm" onclick="delLedRow('${e.id}')">حذف</button></td>
    </tr>`;}).join('');
  const bal=deb-cre;
  box.innerHTML=`
  <div class="card ledSheet watermark">
    <div class="ledHead">

/* تفقيط مبسّط للدنانير */
function numWords(n){
  n=Math.round((+n||0)*1000)/1000;
  const din=Math.floor(n), fils=Math.round((n-din)*1000);
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة',
    'أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const huns=['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];
  const seg=x=>{
    if(x===0) return '';
    if(x<20) return ones[x];
    if(x<100){ const t=Math.floor(x/10),o=x%10; return o?ones[o]+' و'+tens[t]:tens[t]; }
    const h=Math.floor(x/100), r=x%100;
    return r?huns[h]+' و'+seg(r):huns[h];
  };
  const th=Math.floor(din/1000), rest=din%1000;
  let out='';
  if(th) out += (th===1?'ألف':th===2?'ألفان':seg(th)+' آلاف')+(rest?' و':'');
  if(rest||!th) out += seg(rest)||'صفر';
  let s=out+' دينار';
  if(fils) s+=' و'+seg(fils)+' فلس';
  return s+' فقط';
}

/* سحب وإفلات */
function dropImg(e){
  e.preventDefault();
  const dz=$('dropZone'); if(dz) dz.classList.remove('over');
  const f=[...(e.dataTransfer?.files||[])].find(x=>/^image\//.test(x.type));
  if(f) pickImg(f);
  else notify('ما لقيت صورة بالملف المسحوب','warn');
}

/* لصق بضغطة زر — بيقرأ من الحافظة مباشرة */
async function tryPaste(){
  try{
    if(!navigator.clipboard || !navigator.clipboard.read){
      notify('اضغط Ctrl+V للصق الصورة','warn',4000); return;
    }
    const items=await navigator.clipboard.read();
    for(const it of items){
      const type=it.types.find(t=>t.startsWith('image/'));
      if(type){
        const blob=await it.getType(type);
        pickImg(new File([blob],'pasted.png',{type}));
        return;
      }
    }
    notify('ما في صورة بالحافظة — انسخ صورة الأول','warn',4000);
  }catch(e){
    /* المتصفح بيرفض القراءة بدون إذن — Ctrl+V بيضل شغّال */
    notify('اضغط Ctrl+V للصق الصورة','warn',4000);
  }
}

function pickImg(f){
  if(!f) return;
  if(!/^image\//.test(f.type)){ notify('الملف مش صورة','warn'); return; }
  compressImg(f).then(o=>{ IMG=o; drawImg(); })
    .catch(()=>notify('ما قدرت أقرأ الصورة','bad'));
}

/* ضغط قبل الإرسال: يوفّر وقت ورفض من المزوّد */
function compressImg(file,maxSide=1600,q=0.82){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const im=new Image();
      im.onerror=rej;
      im.onload=()=>{
        let {width:w,height:h}=im;
        const sc=Math.min(1,maxSide/Math.max(w,h));
        w=Math.round(w*sc); h=Math.round(h*sc);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        const url=c.toDataURL('image/jpeg',q);
        res({url,w,h,kb:Math.round(url.length*0.75/1024)});
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function doVision(){

  const k=(settings.ai.keys||{})[settings.ai.provider];
  if(!k){ notify('احفظ مفتاح API من الإعدادات أولًا','warn'); go('settings'); return; }
  const b=$('visBtn'), old=b.textContent;
  b.disabled=true; b.textContent='⏳ جاري قراءة الصورة…';
  try{
    const {data}=await aiVision(IMG.url);
    const vou=(data.voucher==='إدخال'||data.voucher==='إخراج')?data.voucher:draft.voucher;
    const rows=rowsFromAI(data,{day:draft.day,voucher:vou,date:draft.date});
    if(!rows.length) throw new Error('ما قدرت أقرأ أي بند من الصورة');
    draft.rows=draft.rows.concat(rows);
    draft.voucher=vou; if($('fVou'))$('fVou').value=vou;
    if(data.date&&/^\d{4}-\d{2}-\d{2}$/.test(data.date)){
      draft.date=data.date; if($('fDate'))$('fDate').value=data.date;
    }
    lastSkipped=[];
    drawRows();
    notify(`📷 قرأ ${rows.length} بند من الصورة — راجعهم منيح`,'ok',5000);
  }catch(e){
    const msg=String(e.message||e);
    if(/Failed to fetch|NetworkError|CORS/i.test(msg))
      say('تعذّر الاتصال','المتصفح منع الاتصال بالمزوّد أو ما في إنترنت.<br><br>جرّب مزوّد ثاني من الإعدادات.');
    else say('ما نجحت قراءة الصورة',esc(msg));
  }finally{ b.disabled=false; b.textContent=old; }
}
