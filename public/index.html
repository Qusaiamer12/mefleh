        <td><input type="number" step="any" value="${r.qty}" style="width:72px" onchange="upd(${i},'qty',this.value)"></td>
        <td><input type="number" step="any" value="${r.price}" style="width:85px" onchange="upd(${i},'price',this.value)"></td>
        <td data-f="total"><b>${r.total===''?'—':fx(r.total)}</b></td>
        <td data-f="notes" style="text-align:right;font-size:12.5px">${esc(r.notes)||'<span class="chip cOk">تمام</span>'}</td>
        <td><button class="btn danger sm" onclick="delRow(${i})">حذف</button></td></tr>`).join('')
        ||'<tr><td colspan="10">ما في بنود مطابقة</td></tr>'}
        <tr class="tot"><td colspan="5">الإجمالي</td><td id="sumQty">${fx(sum('qty'))}</td>
        <td></td><td id="sumTot">${fx(sum('total'))}</td><td colspan="2" id="warnChip">${warns?`<span class="chip cWarn">${warns} تنبيه</span>`:'<span class="chip cOk">لا تنبيهات</span>'}</td></tr>
      </tbody></table></div>
    <datalist id="itemList">${items.map(i=>`<option value="${esc(labelOf(i))}">`).join('')}</datalist>
    <div class="row" style="margin-top:14px">
      <button class="btn big" onclick="saveDraft()">💾 احفظ السند <span class="kbd">Ctrl+S</span></button>
      <button class="btn blue" onclick="addRow()">+ سطر</button>
    </div>
    ${lastSkipped.length?skipBox():''}
  </div>`;
}
function skipBox(){
  return `<div class="note"><b>⚠️ سطور فيها أرقام وما فهمتها — راجعها وأدخلها يدوي:</b><br>
   ${lastSkipped.map(s=>'• '+esc(s)).join('<br>')}</div>`;
}
function upd(i,k,v){
  const r=draft.rows[i]; if(!r) return;
  if(['qty','weight','price'].includes(k)) v=(v===''?'':parseFloat(v));
  r[k]=v;
  const heavy=(k==='item');          /* تغيير الصنف بيبدّل السعر والوزن والوحدة */
  if(k==='item'){
    const m=findItem(v)||matchSized(v,[]);
    if(m){ applyItem(r,m); }
    else { r.notes='⚠️ صنف غير موجود بقائمة الأسعار'; }
  }
  if(k==='price'){
    const m=findItem(r.item);
    if(m){ const pr=priceOf(m,draft.voucher);
      r.notes=(pr.price!==''&&Math.abs(pr.price-v)>0.001)
        ? 'سعر مختلف عن القائمة ('+pr.price+')' : ''; }
  }
  calcTotal(r);
  heavy ? drawRows() : patchRow(i);   /* ما منعيد بناء الجدول كله */
}

/* تحديث خفيف: يلمس الصف المعني بس، فما بيضيع مكان المؤشر */
function patchRow(i){
  const r=draft.rows[i];
  const tr=document.querySelector(`#rowsBox tr[data-i="${i}"]`);
  if(!tr){ drawRows(); return; }
  tr.className = r.notes?'warn':'';
  const tot=tr.querySelector('[data-f="total"]');
  if(tot) tot.textContent = r.total===''?'—':fx(r.total);
  const nt=tr.querySelector('[data-f="notes"]');
  if(nt) nt.innerHTML = esc(r.notes)||'<span class="chip cOk">تمام</span>';
  updateRowsSummary();
}
function updateRowsSummary(){
  const R=visibleRows().length?draft.rows:draft.rows;
  const sum=k=>draft.rows.reduce((a,x)=>a+(parseFloat(x[k])||0),0);
  const q=$('sumQty'), t=$('sumTot'), wsp=$('warnChip');
  if(q) q.textContent=fx(sum('qty'));
  if(t) t.textContent=fx(sum('total'));
  const warns=draft.rows.filter(x=>x.notes).length;
  if(wsp) wsp.innerHTML = warns?`<span class="chip cWarn">${warns} تنبيه</span>`
                               :'<span class="chip cOk">لا تنبيهات</span>';
  const fb=$('warnFilterBtn');
  if(fb) fb.textContent = ONLY_WARN?`⚠️ عرض الكل (${draft.rows.length})`:`⚠️ التنبيهات بس (${warns})`;
}

/* يعبّي بيانات الصنف من القائمة حسب نوع السند الحالي */
function applyItem(r,m){
  r.item=m.name; r.base=m.base||m.name; r.unit=m.unit||'';
  const inf=itemSize(m);
  r.weight=(inf.size===null?'':inf.size);
  const pr=priceOf(m,draft.voucher);
  if(pr.price===''){ r.price=''; r.notes='⚠️ ما في سعر لهذا الصنف بالقائمة'; }
  else { r.price=pr.price;
    r.notes=pr.fallback?`ما في سعر ${draft.voucher} — استخدمت السعر الثاني`:''; }
}

/* لما يتغير نوع السند، الأسعار كلها لازم تتحدّث */
function repriceAll(){
  let n=0;
  draft.rows.forEach(r=>{
    const m=findItem(r.item)||matchSized(r.base||r.item,[]);
    if(!m) return;
    const before=r.price;
    applyItem(r,m); calcTotal(r);
    if(before!==r.price) n++;
  });
  if(n) toast(`حدّثت سعر ${n} بند حسب «${draft.voucher}»`);
  drawRows();
}
function delRow(i){
  const r=draft.rows[i]; if(!r) return;
  draft.rows.splice(i,1); drawRows();
  notify(`شلت «${r.item||'بند'}»`,'warn',7000,()=>{
    draft.rows.splice(Math.min(i,draft.rows.length),0,r); drawRows();
    notify('رجع البند ✅','ok'); });
}

async function saveDraft(){
  if(!isAdmin()){ notify('ما إلك صلاحية الحفظ','bad'); return; }
  if(!draft.customer){toast('اختر الزبون أولًا');return;}
  if(!draft.rows.length){toast('لا يوجد بنود');return;}
  const bad=draft.rows.filter(r=>!r.item||r.qty===''||r.price==='');
  if(bad.length){
    const ok=await ask({title:'في بنود ناقصة',ok:'احفظ برضه',cancel:'رجّعني أصلّح',
      body:`في <b>${bad.length}</b> بند ناقص فيه صنف أو عدد أو سعر:<br>
        <span class="mut">${bad.slice(0,5).map(b=>esc(b.item||'(بدون اسم)')).join('، ')}${bad.length>5?' …':''}</span>`});
    if(!ok) return;
  }
  const total=draft.rows.reduce((a,r)=>a+(parseFloat(r.total)||0),0);
  const editing=!!draft.id;
  const inv={ id:draft.id||uid(),
    no:draft.no||nextNo(draft.customer,draft.voucher),
    customer:draft.customer, voucher:draft.voucher, date:draft.date,
    rows:JSON.parse(JSON.stringify(draft.rows)).map(r=>({...r,day:r.day||dayNameOf(draft.date)})),
    total:+total.toFixed(4),
    savedAt:new Date().toISOString() };
  if(editing){ const ix=invoices.findIndex(x=>x.id===draft.id);
    if(ix>=0) invoices[ix]=inv; else invoices.unshift(inv);
    logAction('تعديل',inv,`${inv.rows.length} بند — ${fx(inv.total)}`); }
  else { invoices.unshift(inv); logAction('إنشاء',inv,`${inv.rows.length} بند — ${fx(inv.total)}`); }
  if(saveInv()){
    toast(`✅ تم حفظ السند ${inv.no}`);
    draft={id:'',no:'',customer:inv.customer,voucher:inv.voucher,date:todayStr(),day:'',rows:[]};
    lastSkipped=[]; vEntry();
  }
}
/* معرّف قصير للجهاز — يمنع تكرار رقم السند لو استخدمت أكثر من جهاز */
function deviceTag(){
  if(!settings.device){
    settings.device=Math.random().toString(36).slice(2,4).toUpperCase();
    saveSet();
  }
  return settings.device;
}
function nextNo(cust,vou){
  const code=(settings.customers.find(c=>c.name===cust)||{}).code||'INV';
  const pre=code+'-'+(vou==='إخراج'?'O':'I')+'-';
  const nums=invoices.filter(i=>i.no&&i.no.startsWith(pre))
    .map(i=>parseInt(String(i.no).slice(pre.length))||0);
  let n=(nums.length?Math.max(...nums):0)+1;
  let no=pre+String(n).padStart(4,'0');
  /* لو الرقم موجود (نُسخ من جهاز ثاني) بنزيد لحد ما نلاقي رقم فاضي */
  const taken=new Set(invoices.map(i=>i.no));
  while(taken.has(no)){ n++; no=pre+String(n).padStart(4,'0'); }
  return no+'/'+deviceTag();
}
</script>
<script>
/* ============ ② السندات المحفوظة ============ */
let fInv={q:'',cust:'',vou:'',from:'',to:''};
function vInvoices(){
  $('view').innerHTML=`
  <div class="card">
    <h2>بحث بالسندات</h2>
    <div class="grid g4">
      <div><label>بحث (صنف/رقم سند)</label><input id="iq" value="${esc(fInv.q)}" oninput="fInv.q=this.value;drawInv()"></div>
      ${isAdmin()?`<div><label>الزبون</label><select id="ic" onchange="fInv.cust=this.value;drawInv()">
        <option value="">الكل</option>${custNames().map(c=>`<option ${fInv.cust===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`:''}
      <div><label>النوع</label><select onchange="fInv.vou=this.value;drawInv()">
        <option value="">الكل</option><option ${fInv.vou==='إخراج'?'selected':''}>إخراج</option>
        <option ${fInv.vou==='إدخال'?'selected':''}>إدخال</option></select></div>
      <div><label>من تاريخ</label><input type="date" value="${fInv.from}" onchange="fInv.from=this.value;drawInv()"></div>
      <div><label>إلى تاريخ</label><input type="date" value="${fInv.to}" onchange="fInv.to=this.value;drawInv()"></div>
    </div>
  </div>
  <div id="invBox"></div>`;
  drawInv();
}
function invFiltered(){
  const q=key(fInv.q);
  return scopeInvoices(invoices).filter(v=>{
    if(fInv.cust&&v.customer!==fInv.cust)return false;
    if(fInv.vou&&v.voucher!==fInv.vou)return false;
    if(fInv.from&&v.date<fInv.from)return false;
    if(fInv.to&&v.date>fInv.to)return false;
    if(!q)return true;
    return key(v.no+' '+v.customer+' '+v.rows.map(r=>r.item).join(' ')).includes(q);
  });
}
function drawInv(){
  if(!$('invBox')) return;
  const L=invFiltered();
  const out=L.filter(v=>v.voucher==='إخراج').reduce((a,v)=>a+v.total,0);
  const inn=L.filter(v=>v.voucher==='إدخال').reduce((a,v)=>a+v.total,0);
  $('invBox').innerHTML=`
  <div class="totals">
    <div class="stat"><span>عدد السندات</span><b>${L.length}</b></div>
    <div class="stat"><span>مجموع الإخراج</span><b class="vOut">${fx(out)}</b></div>
    <div class="stat"><span>مجموع الإدخال</span><b class="vIn">${fx(inn)}</b></div>
    <div class="stat"><span>الصافي</span><b>${fx(out-inn)}</b></div>
  </div>
  <div class="card">
    <div class="tw"><table>
    <thead><tr><th>رقم السند</th><th>التاريخ</th><th>الزبون</th><th>النوع</th>
      <th>البنود</th><th>الإجمالي</th><th>إجراءات</th></tr></thead>
    <tbody>${L.length?L.map(v=>`<tr>
      <td><b>${esc(v.no)}</b></td><td>${v.date}</td><td>${esc(v.customer)}</td>
      <td class="${v.voucher==='إخراج'?'vOut':'vIn'}">${v.voucher}</td>
      <td>${v.rows.length}</td><td><b>${fx(v.total)}</b></td>
      <td>
        <button class="btn blue sm" onclick="viewInv('${v.id}')">عرض</button>
        ${isAdmin()?`<button class="btn sm" onclick="editInv('${v.id}')">تعديل</button>
        <button class="btn danger sm" onclick="delInv('${v.id}')">حذف</button>`:''}
      </td></tr>`).join(''):'<tr><td colspan="7">لا يوجد سندات</td></tr>'}</tbody>
    </table></div>
  </div>
  <div id="invDetail"></div>`;
}
function viewInv(id){
  const v=invoices.find(x=>x.id===id); if(!v)return;
  if(!isAdmin() && v.customer!==myCustomer()){ notify('ما إلك صلاحية','bad'); return; }
  if(!$('invDetail')) return;      /* التبويب مش مفتوح */
  $('invDetail').innerHTML=`<div class="card watermark">
    <div class="statementHeader"><img class="reportLogo" src="${BADGE}" alt="ALMEFLEH">
      <h2 style="color:var(--g)">سند ${esc(v.voucher)} — ${esc(v.no)}</h2></div>
    <p class="hint">${esc(v.customer)} • ${v.date}</p>
    <div class="tw"><table><thead><tr><th>#</th><th>اليوم</th><th>الصنف</th><th>الوزن</th>
    <th>الوحدة</th><th>العدد</th><th>سعر العبوة</th><th>الإجمالي</th></tr></thead><tbody>
    ${v.rows.map((r,i)=>{
      const pend=reqs.find(q=>q.invId===v.id&&q.rowId===r.id&&q.status==='pending');
      return `<tr>
      <td>${i+1}</td><td>${esc(r.day)}</td><td class="name">${esc(r.item)}</td>
      <td>${r.weight}</td><td>${esc(r.unit||'—')}</td><td>${r.qty}</td>
      <td class="priceCell ${pend?'pendPrice':''}"
          onclick="askPriceChange('${v.id}','${r.id}')" title="اضغط لطلب تعديل السعر">
        ${fx(r.price)}
        ${pend?`<div class="pendTag">بانتظار الموافقة: ${fx(pend.newPrice)}</div>`
               :`<span class="editHint">✎</span>`}</td>
      <td>${fx(r.total)}</td></tr>`;}).join('')}
    <tr class="tot"><td colspan="7">الإجمالي</td><td>${fx(v.total)}</td></tr>
    </tbody></table></div>
    <p class="hint">💡 اضغط على أي <b>سعر</b> بالجدول عشان تطلب تعديله.</p>
    <div class="row" style="margin-top:12px">
      <button class="btn blue" onclick="window.print()">🖨️ طباعة / PDF</button>
    </div></div>`;
  try{ $('invDetail').scrollIntoView({behavior:'smooth'}); }catch(e){}
}
function editInv(id){
  if(!isAdmin()){ notify('ما إلك صلاحية التعديل','bad'); return; }
  const v=invoices.find(x=>x.id===id); if(!v)return;
  draft={id:v.id,no:v.no,customer:v.customer,voucher:v.voucher,date:v.date,day:'',
    rows:JSON.parse(JSON.stringify(v.rows))};
  lastSkipped=[]; go('entry'); toast('تعديل السند '+v.no);
}
async function delInv(id){
  if(!isAdmin()){ notify('ما إلك صلاحية الحذف','bad'); return; }
  const v=invoices.find(x=>x.id===id); if(!v)return;
  const ok=await ask({title:'حذف السند',danger:true,ok:'احذف',
    body:`رح ينحذف السند <b>${esc(v.no)}</b> — ${esc(v.customer)}<br>
          ${v.rows.length} بند بإجمالي <b>${fx(v.total)}</b>.<br><br>
          <span class="mut">بيروح على سلة المحذوفات وبتقدر ترجّعه.</span>`});
  if(!ok) return;
  invoices=invoices.filter(x=>x.id!==id);
  toTrash('invoice',`سند ${v.no} — ${v.customer} (${fx(v.total)})`,v);
  logAction('حذف',v,`${v.rows.length} بند — ${fx(v.total)}`);
  saveInv(); drawInv();
  const tid=trash[0].id;
  notify(`انحذف السند ${v.no}`,'warn',9000,()=>{ restoreTrash(tid); drawInv();
    notify('رجع السند ✅','ok'); });
}
/* ===== طلب تعديل سعر ===== */
async function askPriceChange(invId,rowId){
  const v=invoices.find(x=>x.id===invId); if(!v) return;
  const r=(v.rows||[]).find(x=>x.id===rowId); if(!r) return;
  if(!isAdmin() && v.customer!==myCustomer()){ notify('ما إلك صلاحية','bad'); return; }
  const dup=reqs.find(q=>q.invId===invId&&q.rowId===rowId&&q.status==='pending');
  if(dup){ notify('في طلب معلّق على هذا البند','warn'); return; }

  const ok=await ask({title:'طلب تعديل سعر',ok:'إرسال الطلب',
    body:`<b>${esc(r.item)}</b> ${r.weight??''}${esc(r.unit||'')} — سند ${esc(v.no)}<br>
      السعر الحالي: <b>${fx(r.price)}</b><br><br>
      <label>السعر الجديد المطلوب</label>
      <input id="__np" type="number" step="any" class="mInput" value="${r.price}">
      <label style="margin-top:8px">سبب التعديل (اختياري)</label>
      <input id="__nr" class="mInput" placeholder="مثال: السعر المتفق عليه 5.5">`});
  if(!ok) return;
  const V=(ok&&ok.vals)||{};
  const np=parseFloat(V.__np);
  const rs=String(V.__nr||'').trim();
  if(isNaN(np)||np<0){ notify('اكتب سعر صحيح','warn'); return; }
  if(Math.abs(np-(+r.price||0))<0.0001){ notify('السعر نفسه — ما في تعديل','warn'); return; }

  reqs.unshift({id:uid(),invId,rowId,invNo:v.no,customer:v.customer,
    item:r.item,weight:r.weight,unit:r.unit,qty:r.qty,
    oldPrice:+r.price||0,newPrice:np,reason:rs,
    by:SESSION.user,byName:SESSION.name,status:'pending',
    at:new Date().toISOString(),t:new Date().toLocaleString('ar-JO')});
  saveReqs();
  /* إشعار لكل المدراء */
  usersList().filter(u=>u.role==='admin').forEach(a=>
    notifyUser(a.user,'طلب تعديل سعر جديد',
      `${SESSION.name} طلب تعديل سعر «${r.item}» بسند ${v.no} من ${fx(r.price)} إلى ${fx(np)}`,
      'req','requests'));
  logAction('طلب تعديل',v,`${r.item}: ${fx(r.price)} → ${fx(np)}`);
  buildTabs();
  if($('invDetail')) viewInv(invId);
  say('تم الإرسال ✅',
    `تم إرسال طلبك بنجاح.<br><br>
     <b>${esc(r.item)}</b>: ${fx(r.price)} ← <b>${fx(np)}</b><br><br>
     <span class="mut">رح يوصلك إشعار أول ما يوافق المدير.</span>`);
}

/* المدير: موافقة / رفض */
async function approveReq(id){
  if(!isAdmin()){ notify('الموافقة للمدير فقط','bad'); return; }
  const q=reqs.find(x=>x.id===id); if(!q||q.status!=='pending') return;
  const ok=await ask({title:'الموافقة على التعديل',ok:'وافق وطبّق',
    body:`<b>${esc(q.item)}</b> — سند ${esc(q.invNo)} (${esc(q.customer)})<br><br>
      السعر: ${fx(q.oldPrice)} ← <b>${fx(q.newPrice)}</b><br>
      ${q.reason?`السبب: ${esc(q.reason)}<br>`:''}<br>
      <span class="mut">رح ينتحدّث السند وإجماليه فورًا.</span>`});
  if(!ok) return;
  const v=invoices.find(x=>x.id===q.invId);
  if(!v){ notify('السند محذوف','bad'); q.status='rejected'; saveReqs(); return; }
  const r=(v.rows||[]).find(x=>x.id===q.rowId);
  if(!r){ notify('البند محذوف','bad'); q.status='rejected'; saveReqs(); return; }
  r.price=q.newPrice; calcTotal(r);
  v.total=+(v.rows.reduce((a,x)=>a+(+x.total||0),0)).toFixed(4);
  q.status='approved'; q.decidedAt=new Date().toLocaleString('ar-JO'); q.decidedBy=SESSION.name;
  saveInv(); saveReqs();
  notifyUser(q.by,'وافق المدير على طلبك ✅',
    `تم تعديل سعر «${q.item}» بسند ${q.invNo} إلى ${fx(q.newPrice)}`,'ok','invoices');
  logAction('موافقة',v,`${q.item}: ${fx(q.oldPrice)} → ${fx(q.newPrice)}`);
  render(); notify('✅ تمت الموافقة وانحدّث السند','ok');
}
async function rejectReq(id){
  if(!isAdmin()){ notify('الرفض للمدير فقط','bad'); return; }
  const q=reqs.find(x=>x.id===id); if(!q||q.status!=='pending') return;
  const ok=await ask({title:'رفض الطلب',danger:true,ok:'ارفض',
    body:`رح يترفض طلب تعديل سعر «${esc(q.item)}» من ${esc(q.byName)}.<br><br>
      <label>سبب الرفض (اختياري)</label>
      <input id="__rr" class="mInput" placeholder="السبب">`});
  if(!ok) return;
  const why=String(((ok&&ok.vals)||{}).__rr||'').trim();
  q.status='rejected'; q.reject=why; q.decidedAt=new Date().toLocaleString('ar-JO');
  q.decidedBy=SESSION.name; saveReqs();
  notifyUser(q.by,'تم رفض طلبك',
    `طلب تعديل سعر «${q.item}» بسند ${q.invNo} انرفض.${why?' السبب: '+why:''}`,'bad','');
  logAction('رفض طلب',null,`${q.item} — ${q.invNo}`);
  render(); notify('انرفض الطلب','warn');
}

</script>
<script>
/* ============ ③ الكشف والتقارير ============ */
let fRep={cust:'',from:'',to:''};
/* أسبوع العمل: السبت -> الخميس (الجمعة عطلة، خارج الكشف) */
function weekBounds(anchor){
  const d=anchor?new Date(anchor+'T12:00:00'):new Date();
  const off=(d.getDay()+1)%7;              /* 6=السبت -> 0 */
  const s=new Date(d); s.setDate(d.getDate()-off);   /* السبت */
  const e=new Date(s); e.setDate(s.getDate()+6);     /* الجمعة */
  return [ymd(s),ymd(e)];
}
function vReport(){
  if(!fRep.from){const w=weekBounds();fRep.from=w[0];fRep.to=w[1];}
  $('view').innerHTML=`
  <div class="card noprint">
    <h2>${isAdmin()?'الكشف الأسبوعي':'كشف حساب '+esc(SESSION.name)}</h2>
    <p class="hint">أسبوع العمل: السبت ← الجمعة. الكشف مرتّب حسب الأيام وملوّن، والإدخال مفصّل زي الإخراج.</p>
    <div class="row" style="margin-bottom:12px">
      <button class="btn ${isThisWeek()?'':'sec'} sm" onclick="setWeek(0)">هذا الأسبوع</button>
      <button class="btn sec sm" onclick="setWeek(-1)">الأسبوع الماضي</button>
      <button class="btn sec sm" onclick="setMonth()">هذا الشهر</button>
      <button class="btn sec sm" onclick="setToday()">اليوم</button>
    </div>
    <div class="grid g4">
      ${isAdmin()?`<div><label>الزبون</label><select onchange="fRep.cust=this.value;drawRep()">
        <option value="">كل الزباين</option>${custNames().map(c=>`<option ${fRep.cust===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`
        :`<div><label>الحساب</label><input value="${esc(myCustomer())}" disabled></div>`}
      <div><label>من</label><input type="date" id="rFrom" value="${fRep.from}" onchange="fRep.from=this.value;drawRep()"></div>
      <div><label>إلى</label><input type="date" id="rTo" value="${fRep.to}" onchange="fRep.to=this.value;drawRep()"></div>
      <div><label>&nbsp;</label>
        <button class="btn" style="width:100%" onclick="exportExcel()">📊 تنزيل Excel</button></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn blue" onclick="window.print()">🖨️ طباعة / PDF</button>
      ${isAdmin()?`<button class="btn orange" onclick="publishWeek()">📢 انشر الكشف للزباين</button>`:''}
    </div>
    ${isAdmin()?pubStatusBox():''}
  </div>
  <div id="repBox"></div>`;
  drawRep();
}

/* حالة النشر للفترة الحالية */
function pubStatusBox(){
  const wk=weekKey(fRep.from);
  const custs=fRep.cust?[fRep.cust]:custNames();
  const rows=custs.map(c=>{
    const has=repList().some(v=>v.customer===c);
    const pub=(pubList()).find(p=>p.customer===c&&p.week===wk);
    return {c,has,pub};
  });
  const anyData=rows.some(r=>r.has);
  if(!anyData) return '';
  return `<div class="pubBox">
    <b>حالة النشر لأسبوع ${wk}:</b>
    <div class="pubRow">${rows.filter(r=>r.has).map(r=>
      `<span class="pubTag ${r.pub?'on':'off'}" title="${r.pub?'نُشر '+esc(r.pub.at):'ما اننشر بعد'}"
        ${r.pub?`onclick="unpublishWeek('${esc(r.c).replace(/'/g,"\\'")}','${wk}')"`:''}>
        ${esc(r.c)} ${r.pub?'✅':'🔒'}</span>`).join('')}</div>
    <div class="hint" style="margin:6px 0 0">🔒 = الزبون لسه ما بيشوف سندات هذا الأسبوع.</div>
  </div>`;
}

async function publishWeek(){
  if(!isAdmin()){ notify('النشر للمدير فقط','bad'); return; }
  const wk=weekKey(fRep.from);
  const w=weekBounds(fRep.from);
  const custs=(fRep.cust?[fRep.cust]:custNames())
    .filter(c=>invoices.some(v=>v.customer===c&&v.date>=w[0]&&v.date<=w[1]));
  if(!custs.length){ notify('ما في سندات بهذا الأسبوع','warn'); return; }
  const already=custs.filter(c=>isPublished(c,w[0]));
  const fresh=custs.filter(c=>!isPublished(c,w[0]));
  if(!fresh.length){ notify('الكشف منشور مسبقًا لكل الزباين','warn'); return; }

  const ok=await ask({title:'نشر الكشف الأسبوعي',ok:'انشر',
    body:`رح ينعرض كشف أسبوع <b>${w[0]} ← ${w[1]}</b> للزباين:<br><br>
      ${fresh.map(c=>{
        const n=invoices.filter(v=>v.customer===c&&v.date>=w[0]&&v.date<=w[1]).length;
        return `• <b>${esc(c)}</b> — ${n} سند`;}).join('<br>')}
      ${already.length?`<br><br><span class="mut">منشور مسبقًا: ${already.map(esc).join('، ')}</span>`:''}
      <br><br><span class="mut">بيوصلهم إشعار وبيقدروا يشوفوا سنداتهم وكشفهم.</span>`});
  if(!ok) return;

  const stamp=new Date().toLocaleString('ar-JO');
  fresh.forEach(c=>{
    pubList().push({customer:c,week:w[0],to:w[1],at:stamp,by:SESSION.name});
    /* إشعار لكل مستخدم مربوط بهذا الزبون */
    usersList().filter(u=>u.customer===c).forEach(u=>{
      const tot=invoices.filter(v=>v.customer===c&&v.date>=w[0]&&v.date<=w[1]);
      const out=tot.filter(v=>v.voucher==='إخراج').reduce((a,v)=>a+v.total,0);
      const inn=tot.filter(v=>v.voucher==='إدخال').reduce((a,v)=>a+v.total,0);
      notifyUser(u.user,'📢 صدر كشفك الأسبوعي',
        `كشف ${w[0]} ← ${w[1]} — ${tot.length} سند · الصافي ${fx(out-inn)}`,'ok','report');
    });
  });
  saveSet();
  logAction('نشر كشف',null,`${w[0]} ← ${w[1]} — ${fresh.join('، ')}`);
  vReport();
  notify(`📢 اننشر الكشف لـ ${fresh.length} زبون`,'ok',5000);
}

/* سحب النشر */
async function unpublishWeek(cust,wk){
  if(!isAdmin()) return;
  const ok=await ask({title:'سحب النشر',danger:true,ok:'اسحب',
    body:`رح يختفي كشف أسبوع <b>${wk}</b> عن <b>${esc(cust)}</b> لحد ما تنشره مرة ثانية.`});
  if(!ok) return;
  settings.published=pubList().filter(p=>!(p.customer===cust&&p.week===wk));
  saveSet(); vReport(); notify('انسحب النشر','warn');
}
function isThisWeek(){ const w=weekBounds(); return fRep.from===w[0]&&fRep.to===w[1]; }
function setWeek(off){
  const d=new Date(); d.setDate(d.getDate()+off*7);
  const w=weekBounds(ymd(d)); fRep.from=w[0]; fRep.to=w[1]; vReport();
}
function setMonth(){
  const d=new Date();
  fRep.from=ymd(new Date(d.getFullYear(),d.getMonth(),1));
  fRep.to=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));
  vReport();
}
function setToday(){ fRep.from=todayStr(); fRep.to=todayStr(); vReport(); }
function thisWeek(){ setWeek(0); }
function repList(){
  if(!isAdmin()) fRep.cust=myCustomer();
  return scopeInvoices(invoices).filter(v=>{
    if(fRep.cust&&v.customer!==fRep.cust)return false;
    if(fRep.from&&v.date<fRep.from)return false;
    if(fRep.to&&v.date>fRep.to)return false;
    return true;});
}
/* لون ثابت لكل يوم — نفس فكرة كشفك الملوّن */
const DAY_COLOR={'السبت':'d-sat','الأحد':'d-sun','الاثنين':'d-mon','الثلاثاء':'d-tue',
  'الأربعاء':'d-wed','الخميس':'d-thu','الجمعة':'d-fri'};

/* يبني جدول قسم (إخراج أو إدخال) مجمّع بالأيام */
function sectionTable(list,title,cls){
  /* تجميع البنود حسب التاريخ */
  const byDate={};
  list.forEach(v=>(v.rows||[]).forEach(r=>{
    const d=v.date||'';
    (byDate[d]=byDate[d]||{day:r.day||dayNameOf(d),rows:[]}).rows.push(r);
  }));
  const dates=Object.keys(byDate).sort();
  const total=list.reduce((a,v)=>a+(+v.total||0),0);
  const cols=7;

  if(!dates.length){
    return `<tr><th colspan="${cols}" class="secHead ${cls}">${title}</th></tr>
      <tr><td colspan="${cols}" class="mut">لا يوجد حركة</td></tr>`;
  }

  let out=`<tr><th colspan="${cols}" class="secHead ${cls}">${title}</th></tr>
    <tr class="colHead"><th>اليوم</th><th>الصنف</th><th>الوزن</th><th>الوحدة</th>
      <th>العدد</th><th>سعر العبوة</th><th>الإجمالي</th></tr>`;

  dates.forEach(d=>{
    const g=byDate[d];
    const dayCls=DAY_COLOR[g.day]||'d-any';
    let dSum=0;
    g.rows.forEach((r,i)=>{
      dSum+=(+r.total||0);
      out+=`<tr class="dayRow ${dayCls}">`;
      if(i===0) out+=`<td class="dayCell ${dayCls}" rowspan="${g.rows.length}">
          <b>${esc(g.day||'—')}</b><div class="dDate">${esc(d)}</div></td>`;
      out+=`<td class="name">${esc(r.item)}</td>
        <td>${r.weight??''}</td><td>${esc(r.unit||'—')}</td>
        <td><b>${r.qty??''}</b></td><td>${fx(r.price)}</td>
        <td class="amt">${fx(r.total)}</td></tr>`;
    });
    /* مجموع اليوم */
    out+=`<tr class="daySum ${dayCls}"><td colspan="6">مجموع ${esc(g.day||d)}</td>
      <td class="amt">${fx(dSum)}</td></tr>`;
  });
  out+=`<tr class="tot"><td colspan="6">مجموع ${title}</td><td class="amt">${fx(total)}</td></tr>`;
  return out;
}

function drawRep(){
  if(!$('repBox')) return;
  const L=repList();
  const custs=fRep.cust?[fRep.cust]:custNames();
  let gOut=0,gIn=0;
  let html='';
  custs.forEach(c=>{
    const sub=L.filter(v=>v.customer===c);
    if(!sub.length)return;
    const o=sub.filter(v=>v.voucher==='إخراج'),i=sub.filter(v=>v.voucher==='إدخال');
    const to=o.reduce((a,v)=>a+v.total,0), ti=i.reduce((a,v)=>a+v.total,0);
    gOut+=to;gIn+=ti;
    html+=`<div class="card watermark cust">
      <div class="custHead">
        <h2>كشف ${esc(c)}</h2>
        <div class="custMeta">${fRep.from} ← ${fRep.to} · ${sub.length} سند</div>
      </div>
      <div class="tw"><table class="sheet">
        <tbody>
        ${sectionTable(o,'سند إخراج','so')}
        ${sectionTable(i,'سند إدخال','si')}
        <tr class="net"><td colspan="6">الصافي النهائي (إخراج − إدخال)</td>
          <td class="amt">${fx(to-ti)}</td></tr>
        </tbody>
      </table></div>
    </div>`;
  });

  /* مقارنة بالفترة السابقة */
  const d1=new Date(fRep.from+'T12:00:00'), d2=new Date(fRep.to+'T12:00:00');
  const span=Math.max(1,Math.round((d2-d1)/864e5)+1);
  const back=(span===7)?7:span;
  const p1=new Date(d1); p1.setDate(p1.getDate()-back);
  const p2=new Date(d2); p2.setDate(p2.getDate()-back);
  const pf=ymd(p1), pt=ymd(p2);
  const prev=scopeInvoices(invoices).filter(v=>(!fRep.cust||v.customer===fRep.cust)&&v.date>=pf&&v.date<=pt);
  const pOut=prev.filter(v=>v.voucher==='إخراج').reduce((a,v)=>a+v.total,0);
  const pIn =prev.filter(v=>v.voucher==='إدخال').reduce((a,v)=>a+v.total,0);
  const delta=(now,before)=>{
    if(!before) return now?'<span class="up">جديد</span>':'';
    const d=((now-before)/before)*100;
    return `<span class="${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(0)}%</span>`;
  };

  /* ملخّص حسب الصنف */
  const agg={};
  L.forEach(v=>v.rows.forEach(r=>{
    const k=(r.item||'—')+'|'+(r.weight??'')+(r.unit||'');
    agg[k]=agg[k]||{item:r.item||'—',size:r.weight,unit:r.unit||'',outQ:0,outV:0,inQ:0,inV:0};
    if(v.voucher==='إخراج'){ agg[k].outQ+=(+r.qty||0); agg[k].outV+=(+r.total||0); }
    else { agg[k].inQ+=(+r.qty||0); agg[k].inV+=(+r.total||0); }
  }));
  const aggList=Object.values(agg).sort((a,b)=>(b.outV+b.inV)-(a.outV+a.inV));
  const aggHtml=aggList.length?`
    <details class="card" ${fRep.openAgg?'open':''} ontoggle="fRep.openAgg=this.open">
    <summary><b>ملخّص حسب الصنف (${aggList.length})</b>
      <span class="mut" style="font-weight:400"> — مجموع كل صنف بالفترة</span></summary>
    <div class="tw" style="margin-top:10px"><table class="sheet">
      <thead><tr class="colHead"><th>الصنف</th><th>الوزن</th><th>الوحدة</th>
        <th>عدد الإخراج</th><th>قيمة الإخراج</th><th>عدد الإدخال</th><th>قيمة الإدخال</th><th>الصافي</th></tr></thead>
      <tbody>${aggList.map(a=>`<tr>
        <td class="name">${esc(a.item)}</td><td>${a.size??''}</td><td>${esc(a.unit||'—')}</td>
        <td>${a.outQ||''}</td><td class="vOut">${a.outV?fx(a.outV):''}</td>
        <td>${a.inQ||''}</td><td class="vIn">${a.inV?fx(a.inV):''}</td>
        <td class="amt"><b>${fx(a.outV-a.inV)}</b></td></tr>`).join('')}</tbody>
    </table></div></details>`:'';

  $('repBox').innerHTML=`
  <div class="card statementHeader">
    <img class="reportLogo" src="${BADGE}" alt="ALMEFLEH">
    <div><h2 style="margin:0;color:var(--g)">كشف حركة المستودع</h2>
      <div class="hint" style="margin:2px 0 0">الفترة ${fRep.from} إلى ${fRep.to}
        ${fRep.cust?' · '+esc(fRep.cust):' · كل الزباين'}</div></div>
  </div>
  <div class="totals">
    <div class="stat"><span>عدد السندات</span><b>${L.length}</b>
      <div class="sub">${prev.length} بالفترة السابقة</div></div>
    <div class="stat"><span>إجمالي الإخراج</span><b class="vOut">${fx(gOut)}</b>
      <div class="sub">${delta(gOut,pOut)} عن ${fx(pOut)}</div></div>
    <div class="stat"><span>إجمالي الإدخال</span><b class="vIn">${fx(gIn)}</b>
      <div class="sub">${delta(gIn,pIn)} عن ${fx(pIn)}</div></div>
    <div class="stat big"><span>الصافي العام</span><b>${fx(gOut-gIn)}</b>
      <div class="sub">${delta(gOut-gIn,pOut-pIn)} عن ${fx(pOut-pIn)}</div></div>
  </div>
  <div class="hint noprint" style="margin:-6px 2px 10px">
    المقارنة مع الفترة السابقة: ${pf} ← ${pt}</div>
  ${aggHtml}${html||(isAdmin()
      ? '<div class="card">لا يوجد حركة بهذه الفترة.</div>'
      : `<div class="card waitBox"><div class="waitIcon">🔒</div>
          <b>كشف هذا الأسبوع لسه ما صدر</b>
          <div class="hint" style="margin-top:6px">رح يوصلك إشعار أول ما ينشره المدير.</div>
        </div>`)}`;
}

/* تصدير Excel — ملف HTML بامتداد xls يفتحه إكسل مباشرة */
function exportExcel(){
  const L=repList(), custs=fRep.cust?[fRep.cust]:custNames();
  const XC={'السبت':'#fde2e2','الأحد':'#ffe8cc','الاثنين':'#fff4c2','الثلاثاء':'#e0f2d9',
            'الأربعاء':'#d6ecfa','الخميس':'#e6ddf7','الجمعة':'#e3e8ee'};
  let h=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">
  <style>body{font-family:Tahoma}table{border-collapse:collapse;margin-bottom:20px;width:100%}
  td,th{padding:5px 7px;text-align:center;border:1px solid #999;font-size:12px}
  .nm{text-align:right;font-weight:bold}
  .ch{background:#0d3f26;color:#fff;font-weight:bold}
  .so{background:#ffc000;font-weight:bold;font-size:14px}
  .si{background:#8fd3ae;font-weight:bold;font-size:14px}
  .t{background:#fff1c2;font-weight:bold}
  .ds{background:#f1f5f9;font-weight:bold}
  .n{background:#d9ead3;font-weight:bold;font-size:13px}
  h1,h2{text-align:center}</style></head><body dir="rtl">
  <div style="text-align:center"><img src="${BADGE}" width="260"></div>
  <h1>كشوفات المستودع — ALMEFLEH</h1>
  <h2>الفترة ${fRep.from} إلى ${fRep.to}</h2>`;

  const sec=(list,title,cls)=>{
    const byDate={};
    list.forEach(v=>(v.rows||[]).forEach(r=>{
      (byDate[v.date]=byDate[v.date]||{day:r.day||dayNameOf(v.date),rows:[]}).rows.push(r); }));
    const ds=Object.keys(byDate).sort();
    const tot=list.reduce((a,v)=>a+(+v.total||0),0);
    let out=`<tr><td colspan="7" class="${cls}">${title}</td></tr>
      <tr class="ch"><th>اليوم</th><th>الصنف</th><th>الوزن</th><th>الوحدة</th>
      <th>العدد</th><th>سعر العبوة</th><th>الإجمالي</th></tr>`;
    if(!ds.length) return out+`<tr><td colspan="7">لا يوجد حركة</td></tr>`;
    ds.forEach(d=>{
      const g=byDate[d], bg=XC[g.day]||'#eef2f6'; let sum=0;
      g.rows.forEach((r,i)=>{
        sum+=(+r.total||0);
        out+='<tr>';
        if(i===0) out+=`<td rowspan="${g.rows.length}" style="background:${bg};font-weight:bold;vertical-align:middle">${esc(g.day||'')}<br><span style="font-size:9px">${esc(d)}</span></td>`;
        out+=`<td class="nm">${esc(r.item)}</td><td>${r.weight??''}</td><td>${esc(r.unit||'')}</td>
          <td>${r.qty??''}</td><td>${fx(r.price)}</td><td>${fx(r.total)}</td></tr>`;
      });
      out+=`<tr class="ds"><td colspan="6">مجموع ${esc(g.day||d)}</td><td>${fx(sum)}</td></tr>`;
    });
    return out+`<tr class="t"><td colspan="6">مجموع ${title}</td><td>${fx(tot)}</td></tr>`;
  };

  custs.forEach(c=>{
    const sub=L.filter(v=>v.customer===c); if(!sub.length)return;
    const o=sub.filter(v=>v.voucher==='إخراج'),i=sub.filter(v=>v.voucher==='إدخال');
    const to=o.reduce((a,v)=>a+v.total,0),ti=i.reduce((a,v)=>a+v.total,0);
    h+=`<h2>كشف ${esc(c)}</h2><table>
      ${sec(o,'سند إخراج','so')}
      ${sec(i,'سند إدخال','si')}
      <tr class="n"><td colspan="6">الصافي النهائي (إخراج − إدخال)</td><td>${fx(to-ti)}</td></tr>
    </table>`;
  });
  h+='</body></html>';
  dl(`كشف_المستودع_${fRep.from}_${fRep.to}.xls`,'\ufeff'+h,'application/vnd.ms-excel;charset=utf-8;');
  notify('📊 نزل ملف Excel','ok');
}
function dl(name,content,mime){
  const b=new Blob([content],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}

<script>
/* ============ ④ قائمة الأسعار ============ */
let iq='';
function vItems(){
  $('view').innerHTML=`
  <div class="card">
    <h2>قائمة الأسعار (${items.length} صنف)</h2>

      <div><label>سعر إخراج العبوة</label><input id="niOut" type="number" step="any" placeholder="—"></div>

  <div id="itemsBox"></div>`;

}
function drawItems(){
  if(!$('itemsBox')) return;
  const q=key(iq);
  const L=items.map((it,ix)=>({it,ix})).filter(o=>!q||key(labelOf(o.it)).includes(q)
    ||(o.it.aliases||[]).some(a=>key(a).includes(q)));
  $('itemsBox').innerHTML=`<div class="card"><div class="tw"><table>
    <thead><tr><th>#</th><th>الصنف</th><th>الوزن</th><th>الوحدة</th>
      <th>سعر إدخال العبوة</th><th>سعر إخراج العبوة</th><th>أسماء بديلة</th><th></th></tr></thead>
    <tbody>${L.map((o,n)=>`<tr>
      <td>${n+1}</td>
      <td class="name"><input value="${esc(o.it.name)}" onchange="updItem(${o.ix},'name',this.value)"></td>
      <td><input type="number" step="any" style="width:78px" value="${o.it.size===null||o.it.size===undefined?'':o.it.size}" onchange="updItem(${o.ix},'size',this.value)"></td>
      <td><input style="width:70px" value="${esc(o.it.unit||'')}" onchange="updItem(${o.ix},'unit',this.value)"></td>
      <td><input type="number" step="any" style="width:95px" value="${o.it.priceIn===null||o.it.priceIn===undefined?'':o.it.priceIn}" onchange="updItem(${o.ix},'priceIn',this.value)"></td>
      <td><input type="number" step="any" style="width:95px" value="${o.it.priceOut===null||o.it.priceOut===undefined?'':o.it.priceOut}" onchange="updItem(${o.ix},'priceOut',this.value)"></td>
      <td class="name"><input value="${esc((o.it.aliases||[]).join('، '))}" onchange="updItem(${o.ix},'aliases',this.value)" placeholder="افصلها بفاصلة"></td>
      <td><button class="btn danger sm" onclick="delItem(${o.ix})">حذف</button></td></tr>`).join('')
      ||'<tr><td colspan="8">لا نتائج</td></tr>'}</tbody></table></div>
    <div class="row" style="margin-top:12px">
      <button class="btn orange" onclick="exportItems()">📊 تنزيل القائمة Excel</button>
    </div></div>`;
}
function updItem(ix,k,v){
  if(k==='priceIn'||k==='priceOut'||k==='size'){
    v=(String(v).trim()===''?null:parseFloat(v));
    if(v!==null&&isNaN(v)) v=null;
  }
  if(k==='aliases') v=v.split(/[،,]/).map(s=>s.trim()).filter(Boolean);
  items[ix][k]=v;
  if(k==='name') items[ix].base=v;
  /* الاسم الكامل يُعاد بناؤه عشان المطابقة تضل صح */
  const it=items[ix];
  const sz=(it.size===null||it.size===undefined)?'':it.size;
  it.label=(it.name+(sz!==''?' '+sz+(it.unit||''):'')).replace(/\s+/g,' ').trim();
  saveItems(); drawItems(); toast('تم التعديل');
}
function addItem(){
  const n=$('niName').value.trim();
  const pin=$('niIn').value.trim()===''?null:parseFloat($('niIn').value);
  const pout=$('niOut').value.trim()===''?null:parseFloat($('niOut').value);
  if(!n){toast('اكتب اسم الصنف');return;}
  if(items.some(i=>key(labelOf(i))===key(n))){toast('الصنف بنفس الحجم موجود مسبقًا');return;}
  const inf=itemSize(n);
  const short=(inf.size!==null)
    ? norm(n).replace(/\s*[\d.]+\s*(كغم|كجم|كغ|كيلو|لتر|غم|غ|ل|ك)?\s*$/,'').trim()
    : n;
  items.unshift({name:short||n,base:short||n,size:inf.size,unit:inf.unit||'',
    label:(short||n)+(inf.size!==null?' '+inf.size+(inf.unit||''):''),
    priceIn:pin,priceOut:pout,aliases:[]});
  saveItems(); $('niName').value='';$('niIn').value='';$('niOut').value='';
  drawItems(); toast('✅ تمت الإضافة');
}
async function delItem(ix){
  const it=items[ix]; if(!it) return;
  const used=invoices.reduce((n,v)=>n+v.rows.filter(r=>
      key(r.item)===key(it.name) && (+r.weight||null)===(it.size??null)).length,0);
  const ok=await ask({title:'حذف صنف من قائمة الأسعار',danger:true,ok:'احذف',
    body:`<b>${esc(labelOf(it))}</b>${used?`<br><br>⚠️ هذا الصنف مستخدم بـ <b>${used}</b> بند بسندات محفوظة.
      الحذف ما بيغيّر السندات القديمة، بس الصنف ما رح ينمسك تلقائيًا بعدين.`:''}
      <br><br><span class="mut">بيروح على سلة المحذوفات.</span>`});
  if(!ok) return;
  const copy={...it};
  items.splice(ix,1); saveItems(); drawItems();
  trash.unshift({id:uid(),kind:'item',index:ix,label:`صنف ${copy.name}`,payload:copy,
    at:new Date().toISOString(),t:new Date().toLocaleString('ar-JO')});
  if(trash.length>50) trash.length=50; saveTrash();
  const tid=trash[0].id;
  notify(`انحذف الصنف ${copy.name}`,'warn',9000,()=>{ restoreTrash(tid); drawItems();
    notify('رجع الصنف ✅','ok'); });
}
function exportItems(){
  let h=`<html><head><meta charset="utf-8"><style>table{border-collapse:collapse}
   td,th{border:1px solid #999;padding:6px}th{background:#075e35;color:#fff}</style></head>
   <body dir="rtl"><div style="text-align:center"><img src="${BADGE}" width="240"></div><h1>قائمة الأسعار</h1><table><tr><th>الصنف</th><th>الوزن</th><th>الوحدة</th><th>سعر الإدخال</th><th>سعر الإخراج</th><th>أسماء بديلة</th></tr>
   ${items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.size??''}</td><td>${esc(i.unit||'')}</td><td>${i.priceIn??'-'}</td><td>${i.priceOut??'-'}</td><td>${esc((i.aliases||[]).join('، '))}</td></tr>`).join('')}
   </table></body></html>`;
  dl(`قائمة_الأسعار_${todayStr()}.xls`,'\ufeff'+h,'application/vnd.ms-excel;charset=utf-8;');
}

async function addUser(){
  const rawUser=$('nuUser').value.trim();
  const name=$('nuName').value.trim(),
        user=rawUser? rawUser.charAt(0).toUpperCase()+rawUser.slice(1) : '',
        cust=$('nuCust').value;
  if(!name||!user){ notify('اكتب الاسم واسم المستخدم','warn'); return; }
  if(usersList().some(x=>String(x.user).toLowerCase()===user)){
    notify('اسم المستخدم مستخدم مسبقًا','warn'); return; }
  const pw=Math.random().toString(36).slice(2,8);
  const salt=newSalt();
  usersList().push({id:uid(),user,name,role:'customer',customer:cust,
    salt,hash:await hashPw(pw,salt),shown:pw,setBy:'المدير',
    changedAt:new Date().toLocaleString('ar-JO'),mustChange:true});
  saveSet(); vSettings();
  say('تم إنشاء الحساب',
    `<b>${esc(name)}</b><br><br>
     اسم المستخدم: <code style="font-size:15px">${esc(user)}</code><br>
     كلمة السر المؤقتة: <code style="font-size:17px;color:#b42318">${pw}</code><br><br>
     <span class="mut">انسخها وابعتها للزبون — رح يتطلب منه يغيّرها أول دخول.
     ما رح تظهر مرة ثانية.</span>`);
}
async function resetPw(id){
  const u=usersList().find(x=>x.id===id); if(!u) return;
  const ok=await ask({title:'كلمة سر جديدة',ok:'ولّد',
    body:`رح يتولّد كلمة سر جديدة لحساب <b>${esc(u.name||u.user)}</b>
      والقديمة ما بتشتغل بعدها.`});
  if(!ok) return;
  const pw=Math.random().toString(36).slice(2,8);
  u.salt=newSalt(); u.hash=await hashPw(pw,u.salt); u.mustChange=true;
  u.shown=pw; u.setBy='المدير'; u.changedAt=new Date().toLocaleString('ar-JO');
  saveSet();
  say('كلمة السر الجديدة',
    `<b>${esc(u.name||u.user)}</b><br><br>
     كلمة السر: <code style="font-size:17px;color:#b42318">${pw}</code><br><br>
     <span class="mut">ابعتها للزبون — ما رح تظهر مرة ثانية.</span>`);

<script>
/* ==========================================================
   ☁️ المزامنة السحابية — Firebase / Firestore   (نسخة v20.1)
   ----------------------------------------------------------
   التخزين المحلي (localStorage + IndexedDB) أساس الإقلاع الفوري
   والعمل بدون إنترنت، وفوقه طبقة مزامنة لحظية:
     • أي حفظ بالنظام ينرفع تلقائيًا — حتى لو الصفحة انفتحت بلا
       نت: التغييرات بتستنى بصندوق بريد وبتدفع لما يرجع الاتصال
     • أي تعديل من جهاز ثاني بيوصل لحظيًا وبيتحدّث العرض
     • مجموعات السجلات (سندات/كشوفات/رسايل/...) بتندمج بذكاء عبر
       Firestore transaction: جهازان أضافا بوقت واحد = الاثنان
       يبقيان. حذفٌ محلي يُحترم عبر شواهد حذف (tombstones) داخلية
     • أول جهاز فيه بيانات بيزرع السحابة تلقائيًا، وباقي الأجهزة
       بتسحب منها بلا ما تعمل شي

   مطلوب منك خطوة واحدة فقط: عبّي FIREBASE_CONFIG تحت
   (بتجيبه من إعدادات مشروعك — شوف docs/FIREBASE_SETUP.md)
   ========================================================== */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyBxHEpk_YrppzIAHzU4xz6fWdTRxDx9pvY",
  authDomain:        "mefleh-1efd3.firebaseapp.com",
  projectId:         "mefleh-1efd3",
  storageBucket:     "mefleh-1efd3.firebasestorage.app",
  messagingSenderId: "926181032024",
  appId:             "1:926181032024:web:c74c8623cbe14b46a7ca2d"
};;

(function(){
'use strict';

/* لو ما في إنترنت أول تحميل — النظام بيشتغل محلي براحته */
if (typeof firebase === 'undefined') { setTimeout(()=>fbBadge('☁️ محلي — فايربيس مش محمّل','off'),300); }

const FB_CHUNK = 200000;            /* حرف/مستند — سقف فايرستور ~1MB والعربي 3 بايت */
const FB_COL   = 'wh_sync';         /* اسم المجموعة بفايرستور */
const RETRY_MS = 15000, RETRY_MAX = 8;

const FB = { ready:false, db:null, col:null, uiT:null, tries:0,
             last:{}, nChunks:{}, cache:{}, timers:{},
             outbox:new Set(),           /* مفاتيح محفوظة محليًا قبل ما نجهز */
             syncIds:{},                 /* آخر IDs معروفة متزامنة لكل مفتاح قابل للدمج */
             tombs:{} };                 /* شواهد حذف محلية بانتظار الدفع */

const fbCfgOK = () =>
  FIREBASE_CONFIG.apiKey    && !/PASTE/.test(FIREBASE_CONFIG.apiKey) &&
  FIREBASE_CONFIG.projectId && !/PASTE/.test(FIREBASE_CONFIG.projectId);

/* ربط مفاتيح التخزين بمتغيرات النظام الحية */
const BIND = [
  [LS.inv,  ()=>invoices,  v=>{invoices=v}],
  [LS.items,()=>items,     v=>{items=v}],
  [LS.set,  ()=>settings,  v=>{settings=v}],
  [LS.log,  ()=>logs,      v=>{logs=v}],
  [LS.trash,()=>trash,     v=>{trash=v}],
  [LS.reqs, ()=>reqs,      v=>{reqs=v}],
  [LS.msgs, ()=>msgs,      v=>{msgs=v}],
  [LS.notes,()=>notes,     v=>{notes=v}],
  [LS.led,  ()=>ledger,    v=>{ledger=v}],
  [LS.lcl,  ()=>lclients,  v=>{lclients=v}],
];
const bBind  = k => BIND.find(b=>b[0]===k);
const getVar = k => { const b=bBind(k); return b?b[1]():undefined; };
const setVar = (k,v)=>{ const b=bBind(k); if(b) b[2](v); };
const fbTimeout = ms => new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms));

/* مجموعات سجلّية قابلة للدمج (عناصرها فيها id من uid()) —
   الإضافات المتزامنة من أكثر من جهاز بتتحفظ، مش آخر كاتب يكسب */
const MERGEABLE = new Set([LS.inv,LS.led,LS.msgs,LS.notes,LS.reqs,LS.trash,LS.lcl]);
const idsOf = arr => new Set((Array.isArray(arr)?arr:[]).map(x=>x&&x.id).filter(Boolean));
const tombs = k => (FB.tombs[k]=FB.tombs[k]||new Set());

/* دمج محلي + سحابي: وحدة بالـ id، المحلي بيكسب عند تعارض نفس الـ id،
   والعناصر اللي بالشواهد المحلية (محذوفة عن قصد) ما بترجع          */
function fbMerge(local,remote,tom){
  const map=new Map();
  (Array.isArray(remote)?remote:[]).forEach(e=>{
    const id=e&&e.id;
    if(id && tom.has(id)) return;                /* محذوف محليًا عن قصد */
    if(id) map.set(id,e);
  });
  (Array.isArray(local)?local:[]).forEach(e=>{
    const id=e&&e.id;
    if(id && tom.has(id)) return;
    if(id) map.set(id,e);                        /* المحلي أحدث نية → بيكسب */
  });
  let out=[...map.values()];
  /* ترتيب لطيف شكليًا للعرض */
  if(out.length && out[0] && out[0].savedAt!==undefined)
    out=out.slice().sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||'')));
  return out;
}

/* شارة الحالة بالترويسة بجانب مؤشر الإنترنت */
function fbBadge(txt,cls,title){
  try{
    let d=document.getElementById('clDot');
    if(!d){
      const n=document.getElementById('netDot');
      if(!n) return;
      n.insertAdjacentHTML('afterend',' <span id="clDot" class="netDot"></span>');
      d=document.getElementById('clDot');
    }
    d.className='netDot '+(cls||'');
    d.textContent=txt;
    d.title=title||'';
  }catch(e){}
}

/* خصوصية: مثل ملف النسخة الاحتياطية بالضبط — ما بنرفع للسحابة
   لا مفاتيح الذكاء الاصطناعي ولا كلمات السر الظاهرة (shown).
   بتضل محلية على جهازك، وبنرجّعها تلقائيًا لما نطبّق سحابي.  */
function fbScrubSet(v){
  try{
    const c=JSON.parse(JSON.stringify(v));
    if(c.ai && c.ai.keys) c.ai.keys={};
    (c.users||[]).forEach(u=>{ delete u.shown; delete u.seedPw; });
    return c;
  }catch(e){ return v; }
}
function fbMergeSet(incoming){
  try{
    const cur=getVar(LS.set)||{};
    const curKeys=(cur.ai&&cur.ai.keys)||{};
    incoming.ai=incoming.ai||{};
    incoming.ai.keys=Object.assign({},incoming.ai.keys||{},curKeys);
    const curShown={};
    (cur.users||[]).forEach(u=>{ if(u&&u.shown) curShown[String(u.user).toLowerCase()]=u.shown; });
    (incoming.users||[]).forEach(u=>{
      const x=String(u.user||'').toLowerCase();
      if(curShown[x] && !u.shown) u.shown=curShown[x];
    });
  }catch(e){}
}

/* ---------- الدفع للسحابة ---------- */
function fbPush(k){
  if(!bBind(k)) return;
  /* رصد الحذف المحلي مبكرًا: أي id كان متزامن واختفى من النسخة
     المحلية هسا = حذف مقصود — بنسجّله بشواهد قبل ما يوصل سحابي */
  if(MERGEABLE.has(k) && FB.syncIds[k]){
    const cur=idsOf(getVar(k));
    FB.syncIds[k].forEach(id=>{ if(!cur.has(id)) tombs(k).add(id); });
    cur.forEach(id=>tombs(k).delete(id));        /* رجع ينضاف؟ شيل الشاهد */
  }
  if(!FB.ready){ FB.outbox.add(k); return; }
  clearTimeout(FB.timers[k]);
  FB.timers[k]=setTimeout(()=>{
    fbPushNow(k).catch(e=>{
      console.warn('fb push',k,e);
      delete FB.last[k];                          /* خلينا المحاولة الجاية تعيد */
      fbBadge('☁️ تعذّر الرفع — شغال محلي','off','آخر فشل: '+String(e&&e.message||e));
    });
  },900);
}

/* كتابة قطع JSON للسحابة داخل batch جاهز (أو ضمن transaction) */
function fbChunkWrites(writeFn,base,json,n,oldN){
  writeFn('set',base+'_m',{chunks:n,len:json.length,t:Date.now()});
  for(let i=0;i<n;i++)
    writeFn('set',base+'_'+i,{i,d:json.slice(i*FB_CHUNK,(i+1)*FB_CHUNK)});
  for(let i=n;i<oldN;i++) writeFn('del',base+'_'+i);
}

async function fbPushNow(k){
  const raw=getVar(k);

  /* === مجموعات قابلة للدمج: اقرا-ادمج-اكتب بذرّية واحدة === */
  if(MERGEABLE.has(k)){
    const tom=tombs(k);
    await FB.db.runTransaction(async t=>{
      const msnap=await t.get(FB.col.doc(k+'_m'));
      let remote=[];
      if(msnap && msnap.exists){
        const m=msnap.data()||{};
        const parts=[];
        for(let i=0;i<(m.chunks||1);i++){
          const cs=await t.get(FB.col.doc(k+'_'+i));
          parts.push(cs&&cs.exists?((cs.data()||{}).d||''):'');
        }
        try{ remote=JSON.parse(parts.join('')); }catch(e){ remote=[]; }
      }
      const local=Array.isArray(raw)?raw:[];
      const merged=fbMerge(local,remote,tom);
      /* لو السحابة فيها عناصر جديدة علينا: حدّث الذاكرة المحلية فورًا */
      if(merged.length!==local.length){
        setVar(k,merged);
        try{ fbLocalSave(k,merged); }catch(e){}
        fbRefreshUI();
        const diff=merged.length-local.length;
        if(diff>0) notify(`☁️ انضاف ${diff} سجل من جهاز ثاني`,'ok',3500);
      }
      const json=JSON.stringify(merged);
      const n=Math.max(1,Math.ceil(json.length/FB_CHUNK));
      const oldN=(msnap&&msnap.exists&&msnap.data().chunks)||FB.nChunks[k]||0;
      fbChunkWrites((op,id,data)=>{ op==='set'?t.set(FB.col.doc(id),data):t.delete(FB.col.doc(id)); },
        k,json,n,oldN);
      FB.last[k]=json; FB.nChunks[k]=n;
      FB.syncIds[k]=idsOf(merged);
      FB.tombs[k]=new Set();                     /* الشواهد اننفذت — امسحها */
    });
    fbBadge('☁️ متصل','on','المزامنة السحابية شغالة');
    return;
  }

  /* === الباقي: استبدال كامل (إعدادات/أصناف/سجل) — آخر كاتب يكسب === */
  const json=JSON.stringify(k===LS.set ? fbScrubSet(raw) : (raw ?? null));
  if(FB.last[k]===json) return;
  const n=Math.max(1,Math.ceil(json.length/FB_CHUNK));
  const oldN=FB.nChunks[k]||0;
  await FB.db.runTransaction(async t=>{
    fbChunkWrites((op,id,data)=>{ op==='set'?t.set(FB.col.doc(id),data):t.delete(FB.col.doc(id)); },
      k,json,n,oldN);
  });
  FB.last[k]=json; FB.nChunks[k]=n;
  fbBadge('☁️ متصل','on','المزامنة السحابية شغالة');
}

/* ---------- السحب من السحابة ---------- */
function fbTryAssemble(k){
  const m=FB.cache[k+'_m']; if(!m) return null;
  let s='';
  for(let i=0;i<m.chunks;i++){
    const c=FB.cache[k+'_'+i];
    if(c==null) return null;
    s+=c;
  }
  return (s.length===m.len)? s : null;
}
function fbApply(k,json){
  let v; try{ v=JSON.parse(json); }catch(e){ return false; }
  FB.last[k]=json;
  const m=FB.cache[k+'_m']; if(m) FB.nChunks[k]=m.chunks;
  if(k===LS.set && v && typeof v==='object') fbMergeSet(v);
  if(MERGEABLE.has(k) && Array.isArray(v)){
    /* دمج مع المحلي — ما بيضيع ولا سجل من الطرفين، والمحذوف محليًا ما بيرجع */
    const before=(Array.isArray(getVar(k))?getVar(k):[]).length;
    v=fbMerge(getVar(k),v,tombs(k));
    FB.syncIds[k]=idsOf(v);
    if(v.length>before) notify(`☁️ وصلك ${v.length-before} سجل جديد من جهاز ثاني`,'ok',3500);
  }else if(MERGEABLE.has(k)){
    FB.syncIds[k]=idsOf(v);
  }
  setVar(k,v);
  try{ fbLocalSave(k,v); }catch(e){}     /* محلي فقط — بلا دفع رجعي */
  return true;
}

/* تحديث الواجهة بعد ما توصل بيانات من جهاز ثاني —
   لو المستخدم عم يكتب بحقل، بنأجّل الرسم لما يوقف */
function fbRefreshUI(){
  clearTimeout(FB.uiT);
  FB.uiT=setTimeout(()=>{
    try{
      const ae=document.activeElement;
      if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){ fbRefreshUI(); return; }
      if(SESSION) render();
    }catch(e){}
  },250);
}

/* ---------- الإقلاع (مع إعادة محاولة) ---------- */
async function fbBootOnce(){
  fbBadge('☁️ بيتصل…','','جاري الاتصال بفايربيس');
  try{ firebase.initializeApp(FIREBASE_CONFIG); }catch(e){}

  /* توثيق مجهول: بس عشان نعرف إن الطلب من تطبيقك — حسابات
     المستخدمين بتضل من داخل النظام كما هي تمامًا           */
  try{
    const auth=firebase.auth();
    await Promise.race([auth.signInAnonymously(), fbTimeout(12000)]);
  }catch(e){ console.warn('fb auth',e); }

  FB.db=firebase.firestore();
  try{ await FB.db.enablePersistence({synchronizeTabs:true}); }catch(e){}
  FB.col=FB.db.collection(FB_COL);

  /* 1) سحبة أولى كاملة (تعادل استرجاع نسخة احتياطية لحظية) */
  fbBadge('☁️ بيسحب البيانات…');
  const snap=await Promise.race([FB.col.get(), fbTimeout(20000)]);
  snap.forEach(d=>{
    const x=d.data();
    if(d.id.endsWith('_m')) FB.cache[d.id]={chunks:x.chunks||1,len:x.len||0};
    else FB.cache[d.id]=x.d||'';
  });
  let applied=0;
  BIND.forEach(([k])=>{
    const json=fbTryAssemble(k);
    if(json===null) return;
    let local=''; try{ const lv=getVar(k); local=JSON.stringify(k===LS.set?fbScrubSet(lv):(lv??null)); }catch(e){}
    if(json!==local){ if(fbApply(k,json)) applied++; }
    else { FB.last[k]=json; const m=FB.cache[k+'_m']; if(m) FB.nChunks[k]=m.chunks;
           if(MERGEABLE.has(k)) FB.syncIds[k]=idsOf(getVar(k)); }
  });
  if(applied) fbRefreshUI();

  /* 2) منفعّل الدفع ونفرّغ صندوق البريد + زراعة المفاتيح الغايبة */
  FB.ready=true;
  const flush=[...FB.outbox]; FB.outbox.clear();
  const seeds=[];
  BIND.forEach(([k])=>{
    if(FB.cache[k+'_m']||flush.includes(k)) return;
    const v=getVar(k);
    const empty=v==null || (Array.isArray(v)&&!v.length)
             || (!Array.isArray(v)&&typeof v==='object'&&!Object.keys(v).length);
    if(!empty) seeds.push(k);
  });
  for(const k of new Set([...flush,...seeds])){
    try{ await fbPushNow(k); }catch(e){ console.warn('seed/flush',k,e); FB.outbox.add(k); }
  }
  if(FB.outbox.size) setTimeout(()=>{ const l=[...FB.outbox]; FB.outbox.clear();
    l.forEach(k=>fbPush(k)); },8000);

  /* 3) استماع لحظي: أي حفظ من جهاز ثاني بيظهر عندك فورًا */
  FB.col.onSnapshot(qs=>{
    const touched=new Set();
    qs.docChanges().forEach(ch=>{
      const id=ch.doc.id;
      if(ch.type==='removed') delete FB.cache[id];
      else{
        const x=ch.doc.data();
        if(id.endsWith('_m')) FB.cache[id]={chunks:x.chunks||1,len:x.len||0};
        else FB.cache[id]=x.d||'';
      }
      touched.add(id.replace(/_(?:m|\d+)$/,''));
    });
    let re=false;
    touched.forEach(k=>{
      if(!bBind(k)) return;
      const json=fbTryAssemble(k);
      if(json===null || json===FB.last[k]) return;
      if(fbApply(k,json)) re=true;
    });
    if(re) fbRefreshUI();
    fbBadge('☁️ متصل','on','المزامنة السحابية شغالة');
  },err=>{
    console.warn('fb listen',err);
    fbBadge('☁️ انقطع — شغال محلي','off',String(err&&err.message||err));
  });

  fbBadge('☁️ متصل','on','المزامنة السحابية شغالة');
  if(applied||seeds.length||flush.length)
    notify('☁️ المزامنة السحابية فعّالة — بياناتك محدّثة على كل الأجهزة','ok',4500);
}

async function fbBoot(){
  if(!fbCfgOK()){
    fbBadge('☁️ محلي','','المزامنة غير مفعّلة بعد — عبّي FIREBASE_CONFIG بالكود');
    return;
  }
  for(FB.tries=1; FB.tries<=RETRY_MAX; FB.tries++){
    try{ await fbBootOnce(); return; }
    catch(e){
      console.warn('fb boot try '+FB.tries,e);
      fbBadge('☁️ بحاول من جديد…','off',
        'محاولة '+FB.tries+' من '+RETRY_MAX+' — '+String(e&&e.message||e));
      await new Promise(r=>setTimeout(r,RETRY_MS));
    }
  }
  fbBadge('☁️ تعذّر الاتصال — النظام شغال محلي','off',
    'تعذّر الاتصال بفايربيس بعد '+RETRY_MAX+' محاولات. بياناتك محفوظة محليًا — حدّث الصفحة لما يرجع النت.');
}

/* ---------- لفّ الحفظ فورًا (قبل جاهزية السحابة حتى):
   أي حفظ محلي بأي لحظة بينسجّل، ويندفع وقت ما يرجع الاتصال ---------- */
let fbLocalSave=function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); idbSet(k,v);}catch(e){} };
if(typeof save==='function' && !window.__fbWrapped){
  window.__fbWrapped=true;
  const _save=save;
  save=function(k,v){
    const r=_save(k,v);
    try{ fbPush(k); }catch(e){}
    return r;
  };
  fbLocalSave=_save;
}

if(typeof firebase !== 'undefined'){
  fbBoot().catch(e=>{
    console.warn('fb boot',e);
    fbBadge('☁️ خطأ — النظام شغال محلي','off',String(e&&e.message||e));
  });
}

})();

</script>
<!-- =============================================================
     🤖 بروكسي الذكاء الاصطناعي عبر الباك إند
     • نشر خدمة وحدة (Render Web Service): لا تعمل شي — النظام
       بيكتشف /api بنفس الدومين تلقائيًا وبيفعّل البروكسي بلا إعدادات
     • واجهة بمكان وAPI بمكان ثاني: عبّي url و token تحت يدويًا
     • بدون باك إند خالص: بضل وضع «مفاتيح المتصفح» شغال زي قبل
     ============================================================= -->
<script>
const AI_PROXY = { url:'', token:'' };   /* اختياري — فقط للنشر المنفصل */

(function(){
'use strict';
const PROXY={ url:(AI_PROXY.url||'').replace(/\/+$/,''), token:AI_PROXY.token||'', providers:null };
let _detectP=null;
async function detect(){
  if(PROXY.url) return true;                          /* معبّى يدويًا — ثابت */
  if(!/^https?:$/.test(location.protocol)) return false;     /* file:// = وضع المتصفح */
  try{
    const r=await fetch(location.origin+'/api/ai/status',{cache:'no-store'});
    if(!r.ok) return false;                           /* ما في باك إند عالدومين */
    const j=await r.json();
    if(!j||!j.configured) return false;
    if(j.tokenRequired && !PROXY.token) return false; /* محمي بتوكن وما منعرفه */
    PROXY.providers=j.configured;
    PROXY.url=location.origin;
    console.log('🤖 بروكسي الذكاء الاصطناعي فعّال عبر السيرفر:',
      Object.keys(j.configured).filter(k=>j.configured[k]).join(', ')||'(بدون مزوّدين)');
    return true;
  }catch(e){ return false; }
}
const useProxy=()=>{ _detectP=_detectP||detect(); return _detectP; };

const hdr=()=>({'Content-Type':'application/json',
  ...(PROXY.token?{'x-ai-token':PROXY.token}:{})});
async function proxyCall(provider,payload){
  const r=await fetch(PROXY.url+'/api/ai/'+provider,
    {method:'POST',headers:hdr(),body:JSON.stringify(payload)});
  const j=await r.json().catch(()=>({}));
  if(r.status===501) return null;                     /* المزوّد غير مُعدّ بالسيرفر → محلي */
  if(!r.ok) throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  return j;
}
const finish=j=>({data:extractJSON(
  (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||''),usage:j.usage});
const localKey=()=>(settings.ai.keys||{})[settings.ai.provider];

const _aiAnalyze=aiAnalyze, _aiVision=aiVision;
aiAnalyze=async function(txt,dayHint){
  if(await useProxy() && (!PROXY.providers || PROXY.providers[settings.ai.provider]!==false)){
    try{
      const p=AI_PROVIDERS[settings.ai.provider];
      const j=await proxyCall(settings.ai.provider,
        {model:p.model,temperature:0,response_format:{type:'json_object'},
         messages:[{role:'user',content:aiPrompt(txt,dayHint)}]});
      if(j!==null) return finish(j);
    }catch(e){
      if(!localKey()) throw e;                        /* ما في مفتاح محلي نرجعله */
    }
  }
  return _aiAnalyze(txt,dayHint);
};
aiVision=async function(dataUrl){
  if(await useProxy() && (!PROXY.providers || PROXY.providers[settings.ai.provider]!==false)){
    try{
      const prov=settings.ai.provider, p=AI_PROVIDERS[prov];
      const model=(settings.ai.visionModels&&settings.ai.visionModels[prov])||p.vision;
      const j=await proxyCall(prov,{model,temperature:0,max_tokens:4000,
        messages:[{role:'user',content:[{type:'text',text:visionPrompt()},
          {type:'image_url',image_url:{url:dataUrl}}]}]});
      if(j!==null) return finish(j);
    }catch(e){
      if(!localKey()) throw e;
    }
  }
  return _aiVision(dataUrl);
};
})();
</script>
